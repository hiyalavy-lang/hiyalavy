<!DOCTYPE html>
<html lang="dv" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thaana Kids - Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+Thaana:wght@400;700;900&family=Noto+Sans+Arabic:wght@400;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Prevent zooming on mobile */
        html, body { touch-action: manipulation; overscroll-behavior: none; }
        .hall-container, .fame-list { touch-action: pan-y; }

        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pinShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
        .pin-shake { animation: pinShake 0.4s ease; }

        /* === Tracing Enhancement Animations === */
        @keyframes guidePulse {
            0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.9; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
            50%  { transform: translate(-50%,-50%) scale(1.35); opacity: 1;   box-shadow: 0 0 0 14px rgba(34,197,94,0); }
            100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.9; box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }
        @keyframes hintDraw {
            0%   { stroke-dashoffset: var(--path-len); opacity: 0.7; }
            80%  { stroke-dashoffset: 0;               opacity: 0.5; }
            100% { stroke-dashoffset: 0;               opacity: 0;   }
        }
        @keyframes borderFlash {
            0%   { border-color: #ef4444; box-shadow: 15px 15px 0 #ef4444, 0 0 20px rgba(239,68,68,0.35); }
            100% { border-color: var(--border-dark); box-shadow: 15px 15px 0 var(--border-dark); }
        }
        @keyframes progressPop {
            0%   { transform: scaleY(1);   }
            40%  { transform: scaleY(1.35); }
            100% { transform: scaleY(1);   }
        }
        @keyframes hintFadeIn  { from { opacity:0; } to { opacity:1; } }
        @keyframes hintFadeOut { from { opacity:1; } to { opacity:0; } }

        .tracing-guide-dot {
            position: absolute; width: 44px; height: 44px;
            border-radius: 50%; background: #ff7675;
            border: 3px solid white;
            pointer-events: none; z-index: 10;
            animation: guidePulse 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255,118,117,0.7));
            transition: left 0.12s ease, top 0.12s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
        }
        .tracing-hint-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            z-index: 5; pointer-events: none;
            animation: hintFadeIn 0.4s ease;
        }
        .tracing-hint-overlay.fade-out {
            animation: hintFadeOut 0.6s ease forwards;
        }
        #tracing-box.border-flash {
            animation: borderFlash 0.5s ease forwards;
        }
        #accuracy-fill.pop {
            animation: progressPop 0.3s ease;
        }
        .tracing-feedback-msg {
            animation: slideDown 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .profile-hub-pill { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50px; padding: 6px 16px 6px 8px; cursor: pointer; transition: all 0.2s; position: relative; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .profile-hub-pill:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--border-dark); }
        .hub-avatar { width: 42px; height: 42px; background: var(--warning); border-radius: 50%; border: 3px solid var(--border-dark); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .hub-info { display: flex; flex-direction: column; line-height: 1.1; }
        .hub-name { font-weight: 900; font-size: 0.95rem; color: #1e293b; }
        .hub-points { font-weight: 800; font-size: 0.75rem; color: #64748b; }
        .hub-chevron { font-size: 0.7rem; color: #94a3b8; margin-left: 4px; }
        .premium-badge { position: absolute; top: -10px; left: -10px; font-size: 1.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .hub-action-btn { width: 100%; padding: 12px; border-radius: 16px; border: 3px solid var(--border-dark); background: #f8fafc; color: #1e293b; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
        .hub-action-btn:hover { background: #f1f5f9; transform: translateY(-2px); }
        .hub-action-btn.premium { background: var(--orange); color: white; border-color: #d97706; }
        .hub-action-btn.logout { color: #ef4444; border-color: #fca5a5; }
        .lang-opt { padding: 15px; border-radius: 20px; border: 3px solid #e2e8f0; background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);  font-weight: 900; font-size: 1rem; cursor: pointer; transition: all 0.2s; color: #475569; position: relative; text-align: center; }
        .lang-opt.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); box-shadow: 0 4px 0 var(--primary); transform: translateY(-2px); }
        .lang-opt:hover:not(.active) { border-color: var(--primary-light); background: #f8fafc; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

</head>

<body data-lang="dhivehi">
    <div id="bg-decoration"></div>
    <div id="transition-overlay"></div>
    <div id="confetti-container"></div>
    <div id="toast-container"></div>

    <div id="app">
        <header class="app-header">
            <div class="logo" id="logo-home" style="cursor:pointer">
                <span class="icon">🎨</span>
                <span class="thaana-text">ތާނަ</span>
                <span class="english-text">Kids</span>
            </div>

            <nav class="main-nav" id="main-nav"></nav>

            <div class="header-right">
                <div id="profile-hub-container"></div>
            </div>
        </header>

        <main id="view-container"></main>

        <div class="app-helper" id="app-helper" style="display:none; pointer-events:none;">
            <div class="app-bubble" id="app-bubble" style="pointer-events:auto;"></div>
        </div>

        <div class="mystery-box-container" id="mystery-box-widget" style="display:none">
            <div class="mystery-box" id="mystery-box">🎁</div>
        </div>

        <footer class="app-footer"
            style="padding: 2rem; text-align: center; color: var(--text-light); font-weight: bold; background: transparent;">
            <p id="footer-text">© 2026 ތާނަ އެކަޑަމީ - މޯލްޑިވްސް</p>
        </footer>
    </div>

    <div id="modal-container"></div>

    <script src="content.js"></script>
    <script>
        // Global Supabase Initialization
        const sbUrl = (typeof CONFIG !== 'undefined') ? CONFIG.SUPABASE_URL : (window.CONFIG ? window.CONFIG.SUPABASE_URL : 'YOUR_SUPABASE_URL');
        const sbKey = (typeof CONFIG !== 'undefined') ? CONFIG.SUPABASE_KEY : (window.CONFIG ? window.CONFIG.SUPABASE_KEY : 'YOUR_SUPABASE_ANON_KEY');
        window.supabaseClient = null;
        try {
            if (sbUrl !== 'YOUR_SUPABASE_URL' && typeof supabase !== 'undefined') {
                window.supabaseClient = supabase.createClient(sbUrl, sbKey);
            } else {
                console.warn("Supabase not initialized globally. Missing config or CDN.");
            }
        } catch (e) {
            console.error("Supabase Global Init Error:", e);
        }

        class App {
            constructor() {
                // Cloud Sync (Supabase)
                this.supabase = window.supabaseClient;

                // Sync settings from LocalStorage (managed by admin.html)
                const savedSettings = JSON.parse(localStorage.getItem('thaana_settings')) || {
                    siteName: 'Thaana Kids',
                    premiumPrice: '200 MVR',
                    bankAccount: '7730000053982',
                    bankName: 'Mohamed Aleef',
                    heroTitle: 'Learn & Play! 🎨',
                    heroSubtitle: 'Start your journey to become a star learner!',
                    heroBtnText: 'Get Started! 🚀',
                    heroEmoji: '🎨',
                    footerText: '© 2026 ތާނަ އެކަޑަމީ - މޯލްޑިވްސް'
                };

                // Automated Premium Check (Removal if expired)
                let isPremium = localStorage.getItem('thaana_isPremium') === 'true';
                const premiumExpiry = localStorage.getItem('thaana_premiumExpiry');
                if (isPremium && premiumExpiry) {
                    const expiryDate = new Date(parseInt(premiumExpiry));
                    if (Date.now() > expiryDate.getTime()) {
                        isPremium = false;
                        localStorage.setItem('thaana_isPremium', 'false');
                        localStorage.removeItem('thaana_premiumExpiry');
                        console.log("Premium subscription expired.");
                    }
                }

                // Dynamic Content & Nav Initialization
                const defaultNav = [
                    { id: 'soundboard', icon: '🔊', label: 'Letters', premium: false },
                    { id: 'fili', icon: '✨', label: 'Fili', premium: true },
                    { id: 'tracing', icon: '✏️', label: 'Tracing', premium: true },
                    { id: 'vocabulary', icon: '🖼️', label: 'Words', premium: true },
                    { id: 'numbers', icon: '🔢', label: 'Numbers', premium: true },
                    { id: 'quiz', icon: '⭐', label: 'Quiz', premium: true },
                    { id: 'extra', icon: '📄', label: 'Extra', premium: true },
                    { id: 'hall', icon: '🏆', label: 'Hall', premium: true },
                    { id: 'badges', icon: '🏅', label: 'Badges', premium: true }
                ];

                this.state = {
                    view: 'landing',
                    language: localStorage.getItem('thaana_language') || 'dhivehi',
                    isPremium: isPremium,
                    isLoggedIn: false,
                    parentEmail: 'parent@example.com',
                    parentPin: localStorage.getItem('thaana_parentPin') || '',
                    pinAttempts: parseInt(localStorage.getItem('thaana_pinAttempts') || '0'),
                    pinBuffer: '',
                    hallFilter: 'monthly',
                    seasonName: localStorage.getItem('thaana_seasonName') || 'Season 1',
                    seasonEnd: localStorage.getItem('thaana_seasonEnd') || '',
                    seasonDaysLeft: 90,
                    kids: [
                        { name: 'ކުޑަކުއްޖާ', ageGroup: 'preschool', avatar: '👶', points: 0, seasonPoints: 0, monthlyPoints: 0, weeklyPoints: 0, dailyPoints: 0, badges: [1], unlockedAvatars: ['👶', '👧', '👦'] }
                    ],
                    activeKidIndex: 0,
                    dailyGameCount: 0,
                    maxDailyGames: 3,
                    timeLeft: 60,
                    globalSettings: savedSettings,
                    customNav: JSON.parse(localStorage.getItem('thaana_nav')) || defaultNav,
                    customContent: JSON.parse(localStorage.getItem('thaana_content')) || content,
                    customFili: JSON.parse(localStorage.getItem('thaana_fili')) || filiData,
                    customExtras: [],
                    mascotShowsToday: parseInt(localStorage.getItem('thaana_mascotShows')) || 0,
                    mascotLastDate: localStorage.getItem('thaana_mascotDate') || ''
                };

                // Add numbers to content if missing
                if (!this.state.customContent.numbers) {
                    this.state.customContent.numbers = content.numbers;
                }

                // Sync to localStorage if first run
                if (!localStorage.getItem('thaana_content')) {
                    localStorage.setItem('thaana_content', JSON.stringify(content));
                    localStorage.setItem('thaana_fili', JSON.stringify(filiData));
                    localStorage.setItem('thaana_nav', JSON.stringify(defaultNav));
                }

                this.viewContainer = document.getElementById('view-container');
                this.mainNav = document.getElementById('main-nav');
                this.audioPool = {};
                this.init();
            }

            init() {
                document.getElementById('mystery-box').onclick = () => { this.playSound('click'); this.openMysteryBox(); };
                this.initDecorations();
                this.initMascotTracking();
                this.initSeasonAndResets();
                this.render();
                this.initSupabase();
                // Active time tracker & screen-time manager loop
                setInterval(() => this.tick(), 1000);
            }

            tick() {
                if (!this.state.isLoggedIn || !this.state.kids) return;
                const activeKid = this.state.kids[this.state.activeKidIndex];
                if (!activeKid) return;

                // 1. Screen Time Manager Countdown
                // Reset daily screen time if day changed
                const todayStr = new Date().toDateString();
                const lastDaily = localStorage.getItem('thaana_lastDailyReset') || '';
                if (lastDaily !== todayStr) {
                    this.state.kids.forEach(k => {
                        if (k.stats && k.stats.screenTimeLimit) {
                            k.stats.screenTimeRemaining = k.stats.screenTimeLimit * 60;
                        }
                    });
                    localStorage.setItem('thaana_lastDailyReset', todayStr);
                    localStorage.setItem('thaana_kids', JSON.stringify(this.state.kids));
                }

                if (activeKid.stats && activeKid.stats.screenTimeLimit) {
                    if (activeKid.stats.screenTimeRemaining === undefined || activeKid.stats.screenTimeRemaining === null) {
                        activeKid.stats.screenTimeRemaining = activeKid.stats.screenTimeLimit * 60;
                    }
                    if (activeKid.stats.screenTimeRemaining > 0) {
                        if (document.visibilityState === 'visible' && !['landing', 'login'].includes(this.state.view) && !this.state.screenTimeLocked) {
                            activeKid.stats.screenTimeRemaining--;
                        }
                    } else {
                        this.lockScreen();
                    }
                }

                // 2. Active Time Spent Tracking per language
                if (document.visibilityState === 'visible' && !['landing', 'login'].includes(this.state.view) && !this.state.screenTimeLocked) {
                    if (!activeKid.stats) activeKid.stats = {};
                    if (!activeKid.stats.timeSpent) activeKid.stats.timeSpent = { dhivehi: 0, english: 0, arabic: 0, numbers: 0 };
                    
                    const curLang = this.state.language || 'dhivehi';
                    if (activeKid.stats.timeSpent[curLang] === undefined) {
                        activeKid.stats.timeSpent[curLang] = 0;
                    }
                    activeKid.stats.timeSpent[curLang]++;

                    // Periodically sync progress
                    this.state.syncCounter = (this.state.syncCounter || 0) + 1;
                    if (this.state.syncCounter >= 20) {
                        this.syncKidProgress(this.state.activeKidIndex);
                        this.state.syncCounter = 0;
                    }
                }
            }

            showToast(msg) {
                const c = document.getElementById('toast-container');
                if (!c) return;
                const t = document.createElement('div');
                t.className = 'app-bubble';
                t.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); color:var(--text-main); font-weight:900; padding:15px 30px; border-radius:30px; border:4px solid var(--border-dark); z-index:10000; font-size:1.2rem; box-shadow:0 10px 30px rgba(0,0,0,0.2); animation:slideDown 0.3s cubic-bezier(0.18,0.89,0.32,1.28); pointer-events:none; white-space:nowrap;';
                t.innerText = msg;
                c.appendChild(t);
                setTimeout(() => {
                    t.style.animation = 'slideDown 0.3s cubic-bezier(0.18,0.89,0.32,1.28) reverse forwards';
                    setTimeout(() => t.remove(), 300);
                }, 3000);
            }

            lockScreen() {
                this.state.screenTimeLocked = true;
                if (document.getElementById('screen-time-lock-overlay')) return;

                const overlay = document.createElement('div');
                overlay.id = 'screen-time-lock-overlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0; left: 0; width: 100vw; height: 100vh;
                    background: radial-gradient(circle, #1e1b4b, #030712);
                    display: flex; flex-direction: column; align-items: center; justify-content: center;
                    z-index: 100000; color: white; text-align: center; padding: 20px;
                    font-family: 'Fredoka', 'dam_madheeh', 'DAM_Madheeh', 'MV Waheed', 'Faruma', 'MVWaheed', 'Mv Eamaan XP', 'A_Waheed', 'Noto Sans Thaana', sans-serif;
                `;

                overlay.innerHTML = `
                    <div style="max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 24px; animation: slideDown 0.5s ease-out;">
                        <div class="lock-mascot-container" style="animation: mascot-float 5s ease-in-out infinite;">
                            <img src="assets/mascot_hug.png" style="width: 180px; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));" onerror="this.src='https://placehold.co/180x180?text=😴'">
                        </div>
                        <div style="font-size: 4.5rem; line-height: 1; margin: 10px 0;">😴💤</div>
                        <h2 style="font-size: 2.5rem; font-weight: 900; color: var(--warning); text-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                            Time to Sleep!
                        </h2>
                        <p style="font-size: 1.5rem; font-weight: 800; line-height: 1.5; color: #cbd5e1; direction: ltr; margin: 0;">
                            "Our friend is getting tired! Let's play again tomorrow!"
                        </p>
                        <p style="font-size: 1.2rem; font-weight: 700; color: #818cf8; margin-top: -10px; margin-bottom: 20px;">
                            އަހަރެމެންގެ އެކުވެރިޔާ ވަރުބަލިވެއްޖެ! މާދަމާ އަލުން ކުޅެލަމާ!
                        </p>
                        <button onclick="app.showUnlockPasscode()" style="background: rgba(255,255,255,0.08); border: 3px dashed rgba(255,255,255,0.25); color: #cbd5e1; padding: 12px 24px; border-radius: 18px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;">
                            🔑 Parents: Unlock Screen
                        </button>
                    </div>
                `;

                document.body.appendChild(overlay);
                this.playSound('wrong');
            }

            showUnlockPasscode() {
                const existing = document.getElementById('unlock-pin-modal');
                if (existing) { existing.remove(); return; }
                const modal = document.createElement('div');
                modal.id = 'unlock-pin-modal';
                modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200000;display:flex;align-items:center;justify-content:center;';
                this._unlockBuffer = '';
                modal.innerHTML = `
                    <div style="background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:5px solid var(--border-dark);border-radius:35px;padding:35px 28px;text-align:center;max-width:320px;width:90%;box-shadow:0 25px 60px rgba(0,0,0,0.4);direction:ltr;font-family:'Fredoka',sans-serif;animation:slideDown 0.3s ease;">
                        <div style="font-size:2.5rem;margin-bottom:8px;">🔑</div>
                        <h3 style="font-size:1.3rem;font-weight:900;margin-bottom:4px;color:#1e293b;">Parent Unlock</h3>
                        <p style="font-size:0.78rem;color:#64748b;font-weight:700;margin-bottom:18px;">Enter your PIN to unlock the screen</p>
                        <div style="display:flex;justify-content:center;gap:14px;margin-bottom:20px;" id="unlock-dots-row">
                            ${[0,1,2,3].map(i=>`<div id="unlock-dot-${i}" style="width:17px;height:17px;border-radius:50%;background:#e2e8f0;border:2px solid #cbd5e1;transition:all 0.2s;"></div>`).join('')}
                        </div>
                        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:220px;margin:0 auto 16px;">
                            ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<div></div>':`<button onclick="app.unlockPinInput('${n}')" style="padding:14px 10px;font-size:1.35rem;font-weight:900;border:3px solid #e2e8f0;border-radius:15px;background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); cursor:pointer;box-shadow:3px 3px 0 #e2e8f0;font-family:inherit;">${n}</button>`).join('')}
                        </div>
                        <button onclick="document.getElementById('unlock-pin-modal').remove()" style="background:#f1f5f9;border:2px solid #e2e8f0;border-radius:15px;padding:10px 30px;font-weight:800;cursor:pointer;color:#64748b;font-family:inherit;">Cancel</button>
                    </div>`;
                document.body.appendChild(modal);
            }

            unlockPinInput(val) {
                if (val === '⌫') {
                    this._unlockBuffer = (this._unlockBuffer || '').slice(0, -1);
                } else {
                    if ((this._unlockBuffer || '').length >= 4) return;
                    this._unlockBuffer = (this._unlockBuffer || '') + val;
                }
                for (let i = 0; i < 4; i++) {
                    const d = document.getElementById(`unlock-dot-${i}`);
                    if (d) { d.style.background = i < this._unlockBuffer.length ? 'var(--primary)' : '#e2e8f0'; d.style.transform = i < this._unlockBuffer.length ? 'scale(1.2)' : 'scale(1)'; }
                }
                if (this._unlockBuffer.length === 4) {
                    if (this._unlockBuffer === this.state.parentPin) {
                        document.getElementById('unlock-pin-modal')?.remove();
                        this.unlockScreen();
                    } else {
                        const row = document.getElementById('unlock-dots-row');
                        if (row) { row.classList.remove('pin-shake'); void row.offsetWidth; row.classList.add('pin-shake'); }
                        setTimeout(() => { for(let i=0;i<4;i++){const d=document.getElementById(`unlock-dot-${i}`);if(d){d.style.background='#fca5a5';}} }, 50);
                        setTimeout(() => { this._unlockBuffer = ''; for(let i=0;i<4;i++){const d=document.getElementById(`unlock-dot-${i}`);if(d){d.style.background='#e2e8f0';d.style.transform='scale(1)';}} }, 600);
                        this.mascotSay('❌ Wrong PIN! Try again.', 2500);
                    }
                }
            }

            unlockScreen() {
                this.state.screenTimeLocked = false;
                const overlay = document.getElementById('screen-time-lock-overlay');
                if (overlay) overlay.remove();

                const activeKid = this.state.kids[this.state.activeKidIndex];
                if (activeKid && activeKid.stats) {
                    // Reset or extend to another 15 mins
                    activeKid.stats.screenTimeRemaining = 15 * 60;
                    this.syncKidProgress(this.state.activeKidIndex);
                    this.mascotSay("🔓 Screen unlocked! 15 more minutes granted.", 5000);
                }
            }


            initMascotTracking() {
                const today = new Date().toDateString();
                if (this.state.mascotLastDate !== today) {
                    this.state.mascotShowsToday = 0;
                    this.state.mascotLastDate = today;
                    localStorage.setItem('thaana_mascotDate', today);
                    localStorage.setItem('thaana_mascotShows', 0);
                }
            }

            getWeeklyResetStr() {
                const now = new Date();
                let lastFriday = new Date(now);
                const dayOfWeek = now.getDay();
                const diffToFriday = (dayOfWeek < 5) ? (dayOfWeek + 2) : (dayOfWeek - 5);
                lastFriday.setDate(now.getDate() - diffToFriday);
                return lastFriday.toDateString();
            }

            getMonthlyResetStr() {
                const now = new Date();
                return `${now.getFullYear()}-${now.getMonth()}`;
            }

            initSeasonAndResets() {
                const now = new Date();
                const todayStr = now.toDateString();
                
                // 1. Daily Reset (00:00)
                const lastDaily = localStorage.getItem('thaana_lastDailyReset') || '';
                if (lastDaily !== todayStr) {
                    localStorage.setItem('thaana_lastDailyReset', todayStr);
                    this.state.kids.forEach(k => k.dailyPoints = 0);
                }

                // 2. Weekly Reset (Every Friday)
                const fridayStr = this.getWeeklyResetStr();
                const lastWeekly = localStorage.getItem('thaana_lastWeeklyReset') || '';
                if (lastWeekly !== fridayStr) {
                    localStorage.setItem('thaana_lastWeeklyReset', fridayStr);
                    this.state.kids.forEach(k => k.weeklyPoints = 0);
                }

                // 3. Monthly Reset
                const currentMonthStr = this.getMonthlyResetStr();
                const lastMonthly = localStorage.getItem('thaana_lastMonthlyReset') || '';
                if (lastMonthly !== currentMonthStr) {
                    localStorage.setItem('thaana_lastMonthlyReset', currentMonthStr);
                    this.state.kids.forEach(k => k.monthlyPoints = 0);
                }

                // 4. Season Tracking (90 Days)
                let seasonEndStr = localStorage.getItem('thaana_seasonEnd') || '';
                let seasonStartStr = localStorage.getItem('thaana_seasonStart') || '';
                let seasonIndex = parseInt(localStorage.getItem('thaana_seasonIndex') || '1');
                
                if (!seasonEndStr || !seasonStartStr) {
                    const start = new Date();
                    const end = new Date();
                    end.setDate(start.getDate() + 90);
                    seasonStartStr = start.toDateString();
                    seasonEndStr = end.toDateString();
                    localStorage.setItem('thaana_seasonStart', seasonStartStr);
                    localStorage.setItem('thaana_seasonEnd', seasonEndStr);
                    localStorage.setItem('thaana_seasonIndex', seasonIndex);
                    localStorage.setItem('thaana_seasonName', `Season ${seasonIndex}`);
                }

                const seasonEndDate = new Date(seasonEndStr);
                const timeDiff = seasonEndDate.getTime() - now.getTime();
                let daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));

                // If Season ended
                if (daysLeft <= 0) {
                    seasonIndex++;
                    const start = new Date();
                    const end = new Date();
                    end.setDate(start.getDate() + 90);
                    seasonStartStr = start.toDateString();
                    seasonEndStr = end.toDateString();
                    localStorage.setItem('thaana_seasonStart', seasonStartStr);
                    localStorage.setItem('thaana_seasonEnd', seasonEndStr);
                    localStorage.setItem('thaana_seasonIndex', seasonIndex);
                    localStorage.setItem('thaana_seasonName', `Season ${seasonIndex}`);
                    this.state.kids.forEach(k => k.seasonPoints = 0);
                    daysLeft = 90;
                    setTimeout(() => {
                        this.mascotSay(`🌟 Welcome to Season ${seasonIndex}! A new 90-day learning adventure begins today! 🚀`, 8000);
                    }, 4000);
                }

                this.state.seasonName = `Season ${seasonIndex}`;
                this.state.seasonEnd = seasonEndStr;
                this.state.seasonDaysLeft = daysLeft;
            }

            checkMascotVisibility() {
                return false;
            }

            async initSupabase() {
                if (!this.supabase) return;

                // 0. Check Auth Session
                const { data: { session } } = await this.supabase.auth.getSession();
                this.handleSessionUpdate(session);

                this.supabase.auth.onAuthStateChange((event, newSession) => {
                    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                        this.handleSessionUpdate(newSession);
                    } else if (event === 'SIGNED_OUT') {
                        this.state.isLoggedIn = false;
                        this.switchView('landing');
                    }
                });

                // 1. Fetch Global Settings
                const { data: settings } = await this.supabase.from('settings').select('*').eq('id', 'global').single();
                if (settings) {
                    this.state.globalSettings = {
                        siteName: settings.site_name,
                        premiumPrice: settings.premium_price,
                        bankAccount: settings.bank_account,
                        bankName: settings.bank_name,
                        heroTitle: settings.hero_title,
                        heroSubtitle: settings.hero_subtitle,
                        heroBtnText: settings.hero_btn_text,
                        heroEmoji: settings.hero_emoji,
                        footerText: settings.footer_text
                    };
                    // Load mascot tips if stored
                    if (settings.mascot_tips) {
                        try { this.state.mascotTips = JSON.parse(settings.mascot_tips); } catch(e) {}
                    }
                }

                // 2. Fetch Curriculum & Nav
                const { data: nData } = await this.supabase.from('app_nav').select('*').order('order_index');
                if (nData && nData.length > 0) this.state.customNav = nData;

                const { data: fData } = await this.supabase.from('app_fili').select('*').order('order_index');
                if (fData && fData.length > 0) this.state.customFili = fData;

                const { data: eData } = await this.supabase.from('app_extras').select('*').order('order_index');
                if (eData) this.state.customExtras = eData;

                const { data: vData } = await this.supabase.from('app_videos').select('*').order('order_index');
                if (vData) this.state.customVideos = vData;

                const { data: colData } = await this.supabase.from('app_coloring').select('*').order('order_index');
                if (colData) {
                    this.state.customColoring = colData;
                    localStorage.setItem('thaana_customColoring', JSON.stringify(colData));
                }

                const { data: cData } = await this.supabase.from('app_content').select('*').order('order_index');
                if (cData && cData.length > 0) {
                    const dbContent = { dhivehi: [], english: [], arabic: [], engdhi: [], numbers: [] };
                    cData.forEach(c => {
                        if (dbContent[c.category]) dbContent[c.category].push(c);
                    });
                    // Merge DB content with local fallbacks for empty categories
                    Object.keys(dbContent).forEach(cat => {
                        this.state.customContent[cat] = dbContent[cat].length > 0 ? dbContent[cat] : content[cat];
                    });
                }

                this.updateUIStrings();
                this.render();

                // 2. Realtime Listener for Settings
                this.supabase.channel('settings-db-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, payload => {
                        const s = payload.new;
                        this.state.globalSettings = {
                            siteName: s.site_name, premiumPrice: s.premium_price, bankAccount: s.bank_account,
                            bankName: s.bank_name, heroTitle: s.hero_title, heroSubtitle: s.hero_subtitle,
                            heroBtnText: s.hero_btn_text, heroEmoji: s.hero_emoji, footerText: s.footer_text
                        };
                        this.updateUIStrings();
                        this.render();
                    }).subscribe();

                // 3. Realtime Listener for Content (Quiz/Letters)
                this.supabase.channel('content-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_content' }, async () => {
                        const { data: cData } = await this.supabase.from('app_content').select('*').order('order_index');
                        if (cData) {
                            const dbContent = { dhivehi: [], english: [], arabic: [], engdhi: [], numbers: [] };
                            cData.forEach(c => {
                                if (dbContent[c.category]) dbContent[c.category].push(c);
                            });
                            // Merge with fallbacks
                            Object.keys(dbContent).forEach(cat => {
                                this.state.customContent[cat] = dbContent[cat].length > 0 ? dbContent[cat] : content[cat];
                            });
                            this.render();
                        }
                    }).subscribe();
            }

            async handleSessionUpdate(session) {
                if (session) {
                    this.state.isLoggedIn = true;
                    this.state.parentEmail = session.user.email;
                    // Load parentPin from Supabase user metadata if not already in localStorage
                    if (!this.state.parentPin) {
                        const metaPin = session.user.user_metadata && session.user.user_metadata.parent_pin;
                        if (metaPin) {
                            this.state.parentPin = metaPin;
                            localStorage.setItem('thaana_parentPin', metaPin);
                        }
                    }

                    // Fetch kids profiles
                    const { data: kidsData } = await this.supabase.from('kids').select('*').eq('user_id', session.user.id);
                    if (kidsData && kidsData.length > 0) {
                        const todayStr = new Date().toDateString();
                        const fridayStr = this.getWeeklyResetStr();
                        const currentMonthStr = this.getMonthlyResetStr();
                        this.state.kids = kidsData.map(k => {
                            const stats = k.stats || {};
                            const isToday = stats.lastActiveDate === todayStr;
                            const isThisWeek = stats.lastWeeklyDate === fridayStr;
                            const isThisMonth = stats.lastMonthlyDate === currentMonthStr;
                            return {
                                dbId: k.id,
                                name: k.name,
                                ageGroup: k.age_group,
                                avatar: k.avatar,
                                points: k.points,
                                seasonPoints: (stats.seasonPoints !== undefined) ? stats.seasonPoints : 0,
                                monthlyPoints: (isThisMonth && stats.monthlyPoints !== undefined) ? stats.monthlyPoints : 0,
                                weeklyPoints: (isThisWeek && stats.weeklyPoints !== undefined) ? stats.weeklyPoints : 0,
                                dailyPoints: (isToday && stats.dailyPoints !== undefined) ? stats.dailyPoints : 0,
                                badges: k.badges || [],
                                stats: stats,
                                unlockedAvatars: k.unlocked_avatars || ['👶', '👧', '👦'],
                                pin: k.pin || null
                            };
                        });
                    } else {
                        // Create default kid if none exists
                        const defaultKid = { user_id: session.user.id, name: 'ކުޑަކުއްޖާ', age_group: 'preschool', avatar: '👶', points: 0, pin: null };
                        const { data: newKid } = await this.supabase.from('kids').insert(defaultKid).select().single();
                        if (newKid) {
                            this.state.kids = [{ dbId: newKid.id, name: newKid.name, ageGroup: newKid.age_group, avatar: newKid.avatar, points: newKid.points, seasonPoints: 0, monthlyPoints: 0, weeklyPoints: 0, dailyPoints: 0, badges: [], stats: {}, unlockedAvatars: ['👶', '👧', '👦'] }];
                        }
                    }
                    this.trackBadgeMetric('activeDay', new Date().toDateString());

                    // Check Premium Payment Status
                    const { data: paymentsData } = await this.supabase.from('payments').select('status').eq('user_id', session.user.id).eq('status', 'verified');
                    if (paymentsData && paymentsData.length > 0) {
                        this.state.isPremium = true;
                    }

                    if (this.state.view === 'landing' || this.state.view === 'login') {
                        this.switchView('soundboard');
                        // PIN Setup prompt for first timers
                        if (!this.state.parentPin) {
                            setTimeout(() => {
                                this.mascotSay("Welcome! 👋 Tap the lock icon to set a Parent PIN and protect your settings!", 6000);
                                this.handleParentAuth();
                            }, 3000);
                        }
                    } else {
                        this.render();
                    }
                }
            }

            async syncKidProgress(index) {
                if (!this.state.isLoggedIn || !this.supabase) return;
                const idx = index !== undefined ? index : this.state.activeKidIndex;
                const kid = this.state.kids[idx];
                if (kid && kid.dbId) {
                    if (!kid.stats) kid.stats = {};
                    kid.stats.seasonPoints = kid.seasonPoints;
                    kid.stats.monthlyPoints = kid.monthlyPoints;
                    kid.stats.weeklyPoints = kid.weeklyPoints;
                    kid.stats.dailyPoints = kid.dailyPoints;
                    kid.stats.lastActiveDate = new Date().toDateString();
                    kid.stats.lastWeeklyDate = this.getWeeklyResetStr();
                    kid.stats.lastMonthlyDate = this.getMonthlyResetStr();

                    await this.supabase.from('kids').update({
                        points: kid.points,
                        badges: kid.badges,
                        stats: kid.stats,
                        unlocked_avatars: kid.unlockedAvatars,
                        avatar: kid.avatar,
                        name: kid.name,
                        age_group: kid.ageGroup,
                        pin: kid.pin
                    }).eq('id', kid.dbId);
                }
            }

            initDecorations() {
                const bg = document.getElementById('bg-decoration');
                const letters = ['ހ', 'ށ', 'ނ', 'A', 'B', 'C', 'أ', 'ބ'];
                for (let i = 0; i < 15; i++) {
                    const el = document.createElement('div');
                    el.className = 'bg-letter';
                    el.innerText = letters[Math.floor(Math.random() * letters.length)];
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.top = Math.random() * 100 + 'vh';
                    el.style.transform = `rotate(${Math.random() * 360}deg)`;
                    bg.appendChild(el);
                }
            }

            handleParentAuth() {
                if (this.state.isLoggedIn) this.showPasscodeModal();
                else this.switchView('login');
            }

            showPasscodeModal() {
                document.getElementById('hub-dropdown')?.remove();
                const existing = document.getElementById('passcode-dropdown');
                if (existing) { existing.remove(); return; }

                const noPin = !this.state.parentPin;

                const dropdown = document.createElement('div');
                dropdown.id = 'passcode-dropdown';
                dropdown.style.cssText = `position:fixed; top:80px; right:20px; width:min(320px,92vw); background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);  border:4px solid var(--border-dark); border-radius:30px; box-shadow:0 20px 50px rgba(0,0,0,0.25); z-index:9000; padding:28px 24px; animation:slideDown 0.3s cubic-bezier(0.18,0.89,0.32,1.28); text-align:center; direction:ltr;`;

                dropdown.innerHTML = `
                    <div style="font-size:2rem; margin-bottom:6px;">${noPin ? '🔐' : '🔒'}</div>
                    <h3 style="font-size:1.25rem; font-weight:900; color:var(--primary); margin-bottom:4px;">${noPin ? 'Set Your PIN' : this.t('Parent Code')}</h3>
                    <p style="font-size:0.78rem; color:#64748b; font-weight:700; margin-bottom:18px;">${noPin ? 'Choose a 4-digit PIN to protect Settings' : 'Enter your 4-digit PIN'}</p>
                    <div style="display:flex; justify-content:center; gap:14px; margin-bottom:20px;" id="pin-dots-row">
                        ${[0,1,2,3].map(i => `<div id="pin-dot-${i}" style="width:17px; height:17px; border-radius:50%; background:#e2e8f0; border:2px solid #cbd5e1; transition:all 0.2s;"></div>`).join('')}
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:9px; max-width:220px; margin:0 auto 14px;">
                        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n => n==='' ? '<div></div>' : `<button onclick="app.pinInput('${n}')" style="padding:14px 10px; font-size:1.35rem; font-weight:900; border:3px solid #e2e8f0; border-radius:15px; background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);  cursor:pointer; transition:all 0.15s; box-shadow:3px 3px 0 #e2e8f0; font-family:inherit;" onmousedown="this.style.cssText+='transform:translateY(3px);box-shadow:none!important'" onmouseup="this.style.transform='';this.style.boxShadow='3px 3px 0 #e2e8f0'">${n}</button>`).join('')}
                    </div>
                    ${!noPin ? `<div onclick="app.forgotPin()" style="cursor:pointer;font-size:0.8rem;font-weight:800;color:#94a3b8;text-decoration:underline;margin-top:4px;">Forgot PIN?</div>` : ''}
                `;
                this.state.pinBuffer = '';
                document.body.appendChild(dropdown);

                setTimeout(() => {
                    const closer = (e) => {
                        const dd = document.getElementById('passcode-dropdown');
                        if (dd && !dd.contains(e.target) && document.contains(e.target) && !e.target.closest('#profile-hub-container')) {
                            dd.remove();
                            this.state.pinBuffer = '';
                            document.removeEventListener('click', closer);
                        }
                    };
                    document.addEventListener('click', closer);
                }, 150);
            }

            pinInput(val) {
                const noPin = !this.state.parentPin;
                if (val === '⌫') {
                    this.state.pinBuffer = (this.state.pinBuffer || '').slice(0, -1);
                } else {
                    if ((this.state.pinBuffer || '').length >= 4) return;
                    this.state.pinBuffer = (this.state.pinBuffer || '') + val;
                }
                // Update visual dots
                const buf = this.state.pinBuffer || '';
                for (let i = 0; i < 4; i++) {
                    const dot = document.getElementById(`pin-dot-${i}`);
                    if (dot) { dot.style.background = i < buf.length ? 'var(--primary)' : '#e2e8f0'; dot.style.transform = i < buf.length ? 'scale(1.2)' : 'scale(1)'; }
                }
                if (buf.length === 4) {
                    if (noPin) {
                        // Setting a new PIN
                        this.state.parentPin = buf;
                        localStorage.setItem('thaana_parentPin', buf);
                        this.state.pinBuffer = '';
                        this.saveParentPinToDb(buf);
                        document.getElementById('passcode-dropdown')?.remove();
                        this.mascotSay('🔒 PIN set! Your settings are now protected. 🎉', 5000);
                        setTimeout(() => this.showSettings(), 400);
                    } else {
                        this.verifyPasscode();
                    }
                }
            }

            verifyPasscode() {
                const entered = this.state.pinBuffer || '';
                if (entered === this.state.parentPin) {
                    this.state.pinAttempts = 0;
                    localStorage.setItem('thaana_pinAttempts', '0');
                    this.state.pinBuffer = '';
                    document.getElementById('passcode-dropdown')?.remove();
                    setTimeout(() => this.showSettings(), 200);
                } else {
                    this.state.pinAttempts = (this.state.pinAttempts || 0) + 1;
                    localStorage.setItem('thaana_pinAttempts', String(this.state.pinAttempts));
                    this.state.pinBuffer = '';
                    // Shake animation
                    const row = document.getElementById('pin-dots-row');
                    if (row) { row.classList.remove('pin-shake'); void row.offsetWidth; row.classList.add('pin-shake'); }
                    setTimeout(() => { for (let i=0;i<4;i++) { const d=document.getElementById(`pin-dot-${i}`); if(d){d.style.background='#fca5a5';d.style.transform='scale(1)';} } }, 50);
                    setTimeout(() => { for (let i=0;i<4;i++) { const d=document.getElementById(`pin-dot-${i}`); if(d){d.style.background='#e2e8f0';} } }, 600);
                    const rem = 5 - this.state.pinAttempts;
                    if (this.state.pinAttempts >= 5) {
                        this.state.pinAttempts = 0;
                        localStorage.setItem('thaana_pinAttempts', '0');
                        document.getElementById('passcode-dropdown')?.remove();
                        this.mascotSay('⚠️ Too many wrong attempts! Sending security alert to your email…', 7000);
                        this.sendSecurityAlertEmail();
                    } else {
                        this.mascotSay(`❌ Wrong PIN! ${rem} attempt${rem!==1?'s':''} left.`, 3000);
                    }
                }
            }

            async saveParentPinToDb(pin) {
                if (!this.supabase) return;
                try { await this.supabase.auth.updateUser({ data: { parent_pin: pin } }); }
                catch(e) { console.log('PIN DB save:', e); }
            }

            async sendSecurityAlertEmail() {
                if (!this.supabase || !this.state.parentEmail) return;
                try {
                    await this.supabase.auth.resetPasswordForEmail(this.state.parentEmail, { redirectTo: window.location.origin });
                    this.mascotSay('📧 Security alert sent to ' + this.state.parentEmail, 8000);
                } catch(e) {
                    this.mascotSay('⚠️ Could not send alert. Please check your account.', 5000);
                }
            }

            forgotPin() {
                document.getElementById('passcode-dropdown')?.remove();
                this.state.pinBuffer = '';
                if (!this.supabase || !this.state.parentEmail) {
                    alert('Could not find your email. Please log out and sign in again.');
                    return;
                }
                if (confirm(`Send a PIN reset link to ${this.state.parentEmail}?`)) {
                    this.supabase.auth.resetPasswordForEmail(this.state.parentEmail, { redirectTo: window.location.origin })
                        .then(() => this.mascotSay('📧 Reset link sent! Check your email inbox.', 7000))
                        .catch(() => this.mascotSay('❌ Could not send reset email. Try logging out and back in.', 5000));
                    // Clear stored PIN so next login prompts setup
                    localStorage.removeItem('thaana_parentPin');
                    this.state.parentPin = '';
                    this.saveParentPinToDb('');
                }
            }

            switchView(view) {
                const premiumViews = ['fili', 'tracing', 'vocabulary', 'quiz', 'hall', 'badges', 'mystery-game', 'extra', 'videos', 'coloring'];
                if (premiumViews.includes(view) && !this.state.isPremium) {
                    this.showUpgradePopup();
                    return;
                }
                this.stopAllAudio();
                this.triggerBubbleTransition(() => {
                    this.state.view = view;
                    if (view !== 'mystery-game') clearInterval(this.state.gameTimer);
                    this.trackBadgeMetric('tabVisited', view);
                    this.render();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            triggerBubbleTransition(callback) {
                const overlay = document.getElementById('transition-overlay');
                overlay.innerHTML = '';
                const fragment = document.createDocumentFragment();
                const colors = ['#FFD93D', '#FF6B6B', '#4D96FF', '#6BCB77', '#FF8400', '#9b59b6', '#1abc9c'];
                for (let i = 0; i < 25; i++) {
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble-particle';
                    const size = 80 + Math.random() * 120;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    bubble.style.cssText = `width:${size}px; height:${size}px; left:${Math.random() * 100}vw; top:${Math.random() * 100}vh; background:${color}; border-color:white; opacity:0.8;`;
                    fragment.appendChild(bubble);
                }
                overlay.appendChild(fragment);
                setTimeout(() => { callback(); setTimeout(() => overlay.innerHTML = '', 1200); }, 600);
            }

            render() {
                this.viewContainer.innerHTML = '';
                this.updateTheme();
                this.renderNav();
                this.renderProfileHub();
                this.updateUIStrings();

                const showMascot = this.checkMascotVisibility();
                document.getElementById('mystery-box-widget').style.display = (this.state.isLoggedIn && this.state.view !== 'mystery-game') ? 'block' : 'none';

                if (this.state.view === 'tracing' && !this.currentTracingLetter) {
                    const lastL = localStorage.getItem('last_tracing_letter');
                    const lastLng = localStorage.getItem('last_tracing_lang');
                    if (lastL && lastLng === this.state.language) {
                        setTimeout(() => this.initTracingCanvas(lastL), 50);
                    }
                }

                switch (this.state.view) {
                    case 'landing': this.renderLanding(); break;
                    case 'login': this.renderLogin(); break;
                    case 'soundboard': this.renderSoundboard(); break;
                    case 'fili': this.renderFili(); break;
                    case 'tracing': this.renderTracing(); break;
                    case 'vocabulary': this.renderVocabulary(); break;
                    case 'numbers': this.renderNumbers(); break;
                    case 'quiz': this.renderQuiz(); break;
                    case 'videos': this.renderVideos(); break;
                    case 'hall': this.renderHallOfFame(); break;
                    case 'badges': this.renderBadges(); break;
                    case 'mystery-game': this.renderMysteryGame(); break;
                    case 'extra': this.renderExtra(); break;
                    case 'coloring': this.renderColoring(); break;
                }
            }

            updateTheme() {
                document.body.setAttribute('data-lang', this.state.language);
                document.documentElement.dir = (this.state.language === 'english') ? 'ltr' : 'rtl';
                document.documentElement.lang = (this.state.language === 'english') ? 'en' : 'dv';
            }

            updateUIStrings() {
                const s = this.state.globalSettings;
                document.getElementById('footer-text').innerText = s.footerText || this.t('footer');

                // Update Logo
                const logoContainer = document.getElementById('logo-home');
                if (logoContainer && s.siteName) {
                    document.title = s.siteName;
                    const icon = s.heroEmoji || '🎨';
                    const parts = s.siteName.split(' ');
                    const firstPart = parts[0] || '';
                    const rest = parts.slice(1).join(' ') || '';
                    
                    logoContainer.innerHTML = `
                        <span class="icon">${icon}</span>
                        <span class="thaana-text">${firstPart}</span>
                        <span class="english-text">${rest}</span>
                    `;
                    logoContainer.onclick = () => {
                        this.switchView(this.state.isLoggedIn ? 'soundboard' : 'landing');
                    };
                }
            }

            renderProfileHub() {
                const container = document.getElementById('profile-hub-container');
                if (!this.state.isLoggedIn) {
                    container.innerHTML = `<button class="nav-btn" onclick="app.switchView('login')">🔑 ${this.t('Login')}</button>`;
                    return;
                }

            async submitPayment() {
                const fileInput = document.getElementById('slip-upload');
                const file = fileInput.files[0];
                if (!file) { alert("Please upload a slip!"); return; }
                if (!this.supabase) return alert("System offline. Try again later.");

                const btn = event.target;
                btn.innerText = "UPLOADING...";

                try {
                    // Upload slip to Supabase Storage
                    const ext = file.name.split('.').pop();
                    const filename = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
                    const { data: uploadData, error: uploadError } = await this.supabase.storage.from('slips').upload(filename, file);
                    if (uploadError) throw uploadError;

                    // Insert into Payments table
                    const { data: { session } } = await this.supabase.auth.getSession();
                    const { error: dbError } = await this.supabase.from('payments').insert({
                        user_id: session.user.id,
                        user_email: session.user.email,
                        amount: this.state.globalSettings.premiumPrice,
                        slip_url: filename,
                        status: 'pending'
                    });
                    if (dbError) throw dbError;

                    alert("Slip uploaded! Our team will verify and unlock your premium features shortly. ✨");
                    document.getElementById('payment-modal').remove();
                } catch (e) {
                    console.error(e);
                    alert("Upload failed. Please try again. " + e.message);
                    btn.innerText = "Verify Payment";
                }
            }
