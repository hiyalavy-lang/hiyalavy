            addTaskProgress(type, customPts) {
                const kid = this.state.kids[this.state.activeKidIndex];
                const ptsToAdd = customPts !== undefined ? customPts : 10;
                kid.points += ptsToAdd;
                kid.seasonPoints = (kid.seasonPoints || 0) + ptsToAdd;
                kid.monthlyPoints = (kid.monthlyPoints || 0) + ptsToAdd;
                kid.weeklyPoints = (kid.weeklyPoints || 0) + ptsToAdd;
                kid.dailyPoints = (kid.dailyPoints || 0) + ptsToAdd;
                if (!kid.stats) kid.stats = {};
                
                // Track metrics for badge progress
                if (this.state.view === 'tracing') kid.stats.totalTraces = (kid.stats.totalTraces || 0) + 1;
                if (this.state.view === 'quiz') kid.stats.totalQuizzes = (kid.stats.totalQuizzes || 0) + 1;
                
                if (this.state.language === 'numbers') kid.stats.numPoints = (kid.stats.numPoints || 0) + ptsToAdd;
                if (this.state.language === 'dhivehi') kid.stats.dhivehiTasks = (kid.stats.dhivehiTasks || 0) + 1;
                if (this.state.language === 'english') kid.stats.englishTasks = (kid.stats.englishTasks || 0) + 1;
                if (this.state.language === 'arabic') kid.stats.arabicTasks = (kid.stats.arabicTasks || 0) + 1;

                this.checkBadges(kid);
                this.syncKidProgress();
                this.state.dailyTasksCompleted++;
                if (this.state.dailyTasksCompleted >= this.state.dailyTaskGoal) document.getElementById('mystery-box').innerHTML = '🎁✨';
            }

            checkBadges(kid) {
                const earned = kid.badges || [];
                const newBadges = [];
                const stats = kid.stats || {};
                
                const award = (id) => { if (!earned.includes(id)) { earned.push(id); newBadges.push(id); } };

                // Point Milestones
                if (kid.points >= 10) award(1); // First Step
                if (kid.points >= 100) award(16); // Super Student
                if (kid.points >= 250) award(18); // Knowledge King
                if (kid.points >= 500) award(23); // Diamond Badge
                if (kid.points >= 1000) award(27); // Star Student
                if (kid.points >= 1500) award(34); // Winner Spirit
                if (kid.points >= 2000) award(38); // Sun Shiner
                if (kid.points >= 3000) award(44); // Idea Spark
                if (kid.points >= 5000) award(48); // Infinite Wisdom

                // Activity & Module Milestones (matching getBadgeProgress)
                if ((stats.totalTraces || 0) >= 5) award(2);
                if ((stats.totalTraces || 0) >= 20) award(28);
                if ((stats.totalQuizzes || 0) >= 10) award(3);
                if (Object.keys(stats.wordSoundsListened || {}).length >= 10) award(4);
                if ((stats.dhivehiTasks || 0) >= 20) award(5);
                if ((stats.englishTasks || 0) >= 10) award(6);
                if ((stats.arabicTasks || 0) >= 10) award(7);
                if (Object.keys(stats.colorsUsed || {}).length >= 5) award(12);
                if ((stats.wordCardsClicked || 0) >= 15) award(14);
                if (this.state.dailyTasksCompleted >= 5) award(24);
                if (Object.keys(stats.numbersClicked || {}).length >= 10) award(51);
                if ((stats.numPoints || 0) >= 100) award(58);
                if ((stats.numPoints || 0) >= 100) award(62);

                // Video Milestones
                const watchedVidCount = Object.keys(stats.watchedVideos || {}).length;
                if (watchedVidCount >= 1) award(71);
                if (watchedVidCount >= 5) award(72);
                if (watchedVidCount >= 10) award(73);
                if ((stats.videoPointsEarned || 0) >= 150) award(74);
                if (Object.keys(stats.videoCategoriesWatched || {}).length >= 3) award(75);
                if (watchedVidCount >= 20) award(76);

                // Other milestones
                if (this.state.kids.length >= 2) award(45); // Team Player
                if (this.state.dailyTasksCompleted >= this.state.dailyTaskGoal) award(15); // Mystery Solver
                
                if (newBadges.length > 0) {
                    kid.badges = earned;
                    setTimeout(() => {
                        const b = badges.find(x => x.id === newBadges[0]);
                        if (b) {
                            this.mascotSay(`🎉 WOW! You earned the ${b.name} badge! ${b.icon}`, 5000);
                            this.playSound('fanfare');
                        }
                    }, 2000);
                }
            }

            openMysteryBox() { if (this.state.dailyGameCount >= this.state.maxDailyGames) { alert("Game limit reached!"); return; } if (this.state.dailyTasksCompleted < this.state.dailyTaskGoal) { alert("More tasks needed!"); return; } this.state.dailyGameCount++; this.trackBadgeMetric('mysteryBoxesOpened', 1); this.switchView('mystery-game'); }

            renderMysteryGame() {
                this.state.timeLeft = 60;
                this.viewContainer.innerHTML = `<div class="hall-container" style="text-align:center; border-color:var(--orange)"><h2>🦖 Dino Jump!</h2><p id="game-timer">Time Left: 01:00</p><div id="game-canvas" style="width:100%; height:300px; background:#f0f0f0; border-radius:20px; position:relative; overflow:hidden; border:6px solid var(--border-dark)"><div id="dino" style="position:absolute; bottom:0; left:50px; font-size:3rem">🦖</div><div id="cactus" style="position:absolute; bottom:0; right:-50px; font-size:2.5rem">🌵</div><div id="score" style="position:absolute; top:10px; left:10px; font-size:1.5rem; font-weight:800">Score: 0</div></div><p style="margin-top:10px">Tap to Jump!</p></div>`;
                this.startDinoGame();
                this.state.gameTimer = setInterval(() => { this.state.timeLeft--; document.getElementById('game-timer').innerText = `Time Left: 00:${this.state.timeLeft < 10 ? '0' : ''}${this.state.timeLeft}`; if (this.state.timeLeft <= 0) { clearInterval(this.state.gameTimer); alert("Time's up!"); this.switchView('soundboard'); } }, 1000);
            }

            startDinoGame() {
                this.trackBadgeMetric('dinoJumpsPlayed', 1);
                const dino = document.getElementById('dino'); const cactus = document.getElementById('cactus'); const scoreElement = document.getElementById('score');
                let score = 0; let isJumping = false;
                document.getElementById('game-canvas').onclick = () => { if (isJumping) return; isJumping = true; let pos = 0; const up = setInterval(() => { if (pos >= 150) { clearInterval(up); const down = setInterval(() => { if (pos <= 0) { clearInterval(down); isJumping = false; } pos -= 5; dino.style.transform = `translate3d(0, -${pos}px, 0)`; }, 10); } pos += 5; dino.style.transform = `translate3d(0, -${pos}px, 0)`; }, 10); };
                const update = () => {
                    if (this.state.view !== 'mystery-game') return;
                    let cPos = parseInt(window.getComputedStyle(cactus).getPropertyValue('right'));
                    let dBottom = isJumping ? parseInt(dino.style.transform.match(/-(\d+)px/)?.[1] || 0) : 0;
                    if (cPos > 350 && cPos < 400 && dBottom < 40) { cactus.style.right = '-50px'; score = 0; scoreElement.innerText = "Score: 0"; }
                    else if (cPos > 500) { cactus.style.right = '-50px'; score++; scoreElement.innerText = "Score: " + score; }
                    else { cactus.style.right = (cPos + 6) + 'px'; }
                    requestAnimationFrame(update);
                };
                requestAnimationFrame(update);
            }

            mascotSay(text, duration = 4000) {
                const helper = document.getElementById('app-helper');
                if (helper) helper.style.display = 'block';
                const bubble = document.getElementById('app-bubble');
                if (!bubble) return;
                bubble.innerText = text;
                bubble.classList.add('show');
                clearTimeout(this.state.mascotTimer);
                this.state.mascotTimer = setTimeout(() => bubble.classList.remove('show'), duration);
            }

            mascotRandomTip() {
                const defaultTips = [
                    this.t('mascot_tip1'),
                    this.t('mascot_tip2'),
                    this.t('mascot_tip3'),
                    this.t('mascot_tip4')
                ];
                const tips = (this.state.mascotTips && this.state.mascotTips.length) ? this.state.mascotTips : defaultTips;
                this.mascotSay(tips[Math.floor(Math.random() * tips.length)]);
                this.playSound('click');
            }

            playSound(type) {
                const sounds = {
                    click: 'assets/click.mp3',
                    success: 'assets/success.mp3',
                    wrong: 'assets/wrong.mp3',
                    pop: 'assets/pop.mp3',
                    fanfare: 'assets/fanfare.mp3',
                    magic: 'assets/magic.mp3'
                };
                const key = sounds[type] || `assets/${type}.mp3`;
                if (!this.audioPool[key]) this.audioPool[key] = new Audio(key);
                this.audioPool[key].currentTime = 0;
                this.audioPool[key].play().catch(() => { });
            }

            playAudio(filename) {
                if (!filename) return;
                const cleanFilename = filename.trim();
                const url = window.supabaseClient ? window.supabaseClient.storage.from('audio').getPublicUrl(cleanFilename).data.publicUrl : `assets/audio/${cleanFilename}`;
                if (!this.audioPool[url]) this.audioPool[url] = new Audio(url);
                this.audioPool[url].currentTime = 0;
                this.audioPool[url].play().catch((e) => console.log("Audio play blocked:", e));
            }
            createPop(x, y) { const pop = document.createElement('div'); pop.className = 'pop-star'; pop.innerHTML = '⭐'; pop.style.left = (x - 20) + 'px'; pop.style.top = (y - 20) + 'px'; document.body.appendChild(pop); setTimeout(() => pop.remove(), 800); }
            triggerExplosion() {
                const container = document.getElementById('confetti-container'); const centerX = window.innerWidth / 2; const centerY = window.innerHeight / 2;
                const colors = ['#FFD93D', '#FF6B6B', '#4D96FF', '#6BCB77', '#FF8400', '#e0c3fc', '#9b59b6', '#1abc9c'];
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 60; i++) {
                    const c = document.createElement('div'); c.className = 'confetti'; const color = colors[Math.floor(Math.random() * colors.length)];
                    const angle = Math.random() * Math.PI * 2; const distance = 150 + Math.random() * 450;
                    const tx = Math.cos(angle) * distance; const ty = Math.sin(angle) * distance;
                    c.style.cssText = `left: ${centerX}px; top: ${centerY}px; background: ${color}; --tx: ${tx}px; --ty: ${ty}px;`; fragment.appendChild(c);
                }
                container.appendChild(fragment); setTimeout(() => container.innerHTML = '', 2500);
            }

            async downloadExtra(url, filename) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Network error');
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename || 'download';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                } catch (err) {
                    // Fallback: open in new tab if fetch fails
                    window.open(url, '_blank');
                }
            }

            prevTracingLetter() {
                const items = this.state.customContent[this.state.language] || [];
                const idx = items.findIndex(i => i.letter === this.currentTracingLetter);
                const prev = items[idx - 1] || items[items.length - 1];
                if (prev) this.initTracingCanvas(prev.letter);
            }

            nextTracingLetter() {
                const items = this.state.customContent[this.state.language] || [];
                const idx = items.findIndex(i => i.letter === this.currentTracingLetter);
                const next = items[idx + 1] || items[0];
                if (next) this.initTracingCanvas(next.letter);
            }
        }
        const app = new App();
        
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW Registered!', reg);
                }).catch(err => {
                    console.log('SW Registration failed:', err);
                });
            });
        }
        let ctx;
        function initCanvas(id) { const canvas = document.getElementById(id); ctx = canvas.getContext('2d'); let drawing = false; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.strokeStyle = '#4D96FF'; canvas.onmousedown = () => { drawing = true; ctx.beginPath(); }; canvas.onmouseup = () => { drawing = false; }; canvas.onmousemove = (e) => { if (!drawing) return; const rect = canvas.getBoundingClientRect(); ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke(); }; }
    </script>
</body>
