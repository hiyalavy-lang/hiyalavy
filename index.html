                this.state.activeSettingsTab = tab;
                const dropdown = document.getElementById('settings-dropdown');
                if (dropdown) this.renderSettingsContent(dropdown);
            }

            setEditingKidIndex(index) {
                this.state.editingKidIndex = parseInt(index);
                const dropdown = document.getElementById('settings-dropdown');
                if (dropdown) this.renderSettingsContent(dropdown);
            }

            getSettingsTabHtml(tab) {
                if (tab === 'general') {
                    return `
                        <div class="settings-group">
                            <label class="settings-label">App Language</label>
                            <select class="settings-select" onchange="app.updateLanguage(this.value)" style="margin-bottom:20px;">
                                <option value="dhivehi" ${this.state.language === 'dhivehi' ? 'selected' : ''}>ދިވެހި (Dhivehi)</option>
                                <option value="english" ${this.state.language === 'english' ? 'selected' : ''}>English ${!this.state.isPremium ? '🔒' : ''}</option>
                                <option value="arabic" ${this.state.language === 'arabic' ? 'selected' : ''}>العربية (Arabic) ${!this.state.isPremium ? '🔒' : ''}</option>
                                <option value="numbers" ${this.state.language === 'numbers' ? 'selected' : ''}>Numbers ${!this.state.isPremium ? '🔒' : ''}</option>
                            </select>
                        </div>
                        <div class="settings-group">
                            <label class="settings-label">${this.t('Security (Parent PIN)')}</label>
                            <div style="display:flex; gap:10px">
                                <input type="password" class="settings-input" id="new-pin" placeholder="New 4-digit PIN" style="margin-bottom:0; flex:1;" maxlength="4">
                                <button class="start-btn" style="padding:10px 20px; font-size:1.1rem; background:var(--teal); color:white; border-width:3px; box-shadow:3px 3px 0 var(--border-dark);" onclick="app.updatePin()">${this.t('Save')}</button>
                            </div>
                        </div>
                    `;
                } else if (tab === 'profiles') {
                    const editIndex = this.state.editingKidIndex >= this.state.kids.length ? 0 : this.state.editingKidIndex;
                    return `
                        <div class="settings-group">
                            <label class="settings-label">Select Profile to Edit</label>
                            <select class="settings-select" id="settings-kid-selector" onchange="app.setEditingKidIndex(this.value)" style="margin-bottom:15px;">
                                ${this.state.kids.map((k, i) => `<option value="${i}" ${i === editIndex ? 'selected' : ''}>${k.avatar} ${k.name}</option>`).join('')}
                            </select>
                        </div>
                        <div id="settings-profile-editor">
                            ${this.getProfileEditorHtml(editIndex)}
                        </div>
                        <button class="nav-btn" style="width:100%; justify-content:center; margin-top:20px; box-shadow:4px 4px 0 var(--border-dark);" onclick="app.addNewKid()">➕ Add New Profile</button>
                    `;
                } else if (tab === 'dashboard') {
                    const activeKid = this.state.kids[this.state.activeKidIndex];
                    const stats = activeKid.stats || {};
                    const ts = stats.timeSpent || { dhivehi: 0, english: 0, arabic: 0, numbers: 0 };
                    
                    const formatTime = (sec) => {
                        if (!sec) return '0m';
                        const m = Math.floor(sec / 60);
                        const s = sec % 60;
                        return m > 0 ? `${m}m ${s}s` : `${s}s`;
                    };

                    const totalTime = (ts.dhivehi || 0) + (ts.english || 0) + (ts.arabic || 0) + (ts.numbers || 0);
                    const dhivehiPct = totalTime ? Math.round(((ts.dhivehi || 0) / totalTime) * 100) : 0;
                    const englishPct = totalTime ? Math.round(((ts.english || 0) / totalTime) * 100) : 0;
                    const arabicPct = totalTime ? Math.round(((ts.arabic || 0) / totalTime) * 100) : 0;
                    const numbersPct = totalTime ? Math.round(((ts.numbers || 0) / totalTime) * 100) : 0;

                    const limit = stats.screenTimeLimit || 0;

                    return `
                        <!-- Screen-Time Manager Section -->
                        <div class="settings-group" style="background:#f0fdf4; border:3px solid var(--secondary); padding:20px; border-radius:25px; margin-bottom:25px;">
                            <h3 style="margin-bottom:10px; font-size:1.2rem; display:flex; align-items:center; gap:8px; color:#15803d;">
                                ⏱️ Screen-Time Manager
                            </h3>
                            <p style="font-size:0.9rem; font-weight:700; color:#166534; margin-bottom:15px; line-height:1.4;">
                                Set a timer to manage daily usage. Screen locks automatically when the time is up.
                            </p>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <label style="font-weight:800; font-size:1rem; color:#166534;">Limit:</label>
                                <select class="settings-select" onchange="app.updateScreenTimeLimit(this.value)" style="margin-bottom:0; flex:1; border-color:var(--secondary); background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); ">
                                    <option value="0" ${limit === 0 ? 'selected' : ''}>No Limit</option>
                                    <option value="5" ${limit === 5 ? 'selected' : ''}>5 Minutes</option>
                                    <option value="10" ${limit === 10 ? 'selected' : ''}>10 Minutes</option>
                                    <option value="15" ${limit === 15 ? 'selected' : ''}>15 Minutes</option>
                                    <option value="30" ${limit === 30 ? 'selected' : ''}>30 Minutes</option>
                                    <option value="45" ${limit === 45 ? 'selected' : ''}>45 Minutes</option>
                                    <option value="60" ${limit === 60 ? 'selected' : ''}>60 Minutes</option>
                                </select>
                            </div>
                        </div>

                        <!-- Language Progress Matrix Section -->
                        <div class="settings-group" style="background:#f8fafc; border:3px solid var(--border-dark); padding:20px; border-radius:25px;">
                            <h3 style="margin-bottom:15px; font-size:1.2rem; display:flex; align-items:center; gap:8px; color:var(--text-main);">
                                📊 Language Progress Matrix
                            </h3>
                            <p style="font-size:0.85rem; font-weight:700; color:#64748b; margin-bottom:20px; line-height:1.4;">
                                Active time spent by <b>${activeKid.name}</b> in each learning category:
                            </p>
                            
                            <div style="display:flex; flex-direction:column; gap:15px;">
                                <!-- Dhivehi Bar -->
                                <div>
                                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem; margin-bottom:5px;">
                                        <span style="color:#a855f7;">🇲🇻 ދިވެހި (Dhivehi)</span>
                                        <span>${formatTime(ts.dhivehi)} (${dhivehiPct}%)</span>
                                    </div>
                                    <div style="background:#e2e8f0; height:18px; border-radius:9px; border:2px solid var(--border-dark); overflow:hidden;">
                                        <div style="background:#c084fc; width:${dhivehiPct}%; height:100%; border-radius:7px; transition:width 0.5s ease-out;"></div>
                                    </div>
                                </div>
                                
                                <!-- English Bar -->
                                <div>
                                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem; margin-bottom:5px;">
                                        <span style="color:#3b82f6;">🇬🇧 English</span>
                                        <span>${formatTime(ts.english)} (${englishPct}%)</span>
                                    </div>
                                    <div style="background:#e2e8f0; height:18px; border-radius:9px; border:2px solid var(--border-dark); overflow:hidden;">
                                        <div style="background:#60a5fa; width:${englishPct}%; height:100%; border-radius:7px; transition:width 0.5s ease-out;"></div>
                                    </div>
                                </div>

                                <!-- Arabic Bar -->
                                <div>
                                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem; margin-bottom:5px;">
                                        <span style="color:#22c55e;">🇸🇦 العربية (Arabic)</span>
                                        <span>${formatTime(ts.arabic)} (${arabicPct}%)</span>
                                    </div>
                                    <div style="background:#e2e8f0; height:18px; border-radius:9px; border:2px solid var(--border-dark); overflow:hidden;">
                                        <div style="background:#4ade80; width:${arabicPct}%; height:100%; border-radius:7px; transition:width 0.5s ease-out;"></div>
                                    </div>
                                </div>

                                <!-- Numbers Bar -->
                                <div>
                                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem; margin-bottom:5px;">
                                        <span style="color:#eab308;">🔢 Numbers</span>
                                        <span>${formatTime(ts.numbers)} (${numbersPct}%)</span>
                                    </div>
                                    <div style="background:#e2e8f0; height:18px; border-radius:9px; border:2px solid var(--border-dark); overflow:hidden;">
                                        <div style="background:#facc15; width:${numbersPct}%; height:100%; border-radius:7px; transition:width 0.5s ease-out;"></div>
                                    </div>
                                </div>
                            </div>

                            <div style="margin-top:20px; font-size:0.85rem; font-weight:800; text-align:center; color:#64748b; background:#f1f5f9; padding:10px; border-radius:12px; border:2px dashed #cbd5e1;">
                                Total Learning Session Time: ${formatTime(totalTime)}
                            </div>
                        </div>
                    `;
                }
                return '';
            }

            getProfileEditorHtml(i) {
                const k = this.state.kids[i];
                if (!k) return '';
                return `
                    <div class="profile-item" style="padding:20px; border-radius:25px; border:4px solid var(--border-dark); background:#f8fafc; position:relative;">
                        <div style="display:flex; gap:15px; margin-bottom:15px; flex-wrap:wrap;">
                            <div style="flex:1; min-width:180px;">
                                <label style="font-weight:800; font-size:0.9rem; color:#64748b; display:block; margin-bottom:5px;">Profile Name</label>
                                <input type="text" class="settings-input" value="${k.name}" placeholder="Name" onchange="app.updateKidProp(${i}, 'name', this.value)" style="margin-bottom:0; width:100%;">
                            </div>
                            <div style="width:120px;">
                                <label style="font-weight:800; font-size:0.9rem; color:#64748b; display:block; margin-bottom:5px;">Age Group</label>
                                <select class="settings-select" onchange="app.updateKidProp(${i}, 'ageGroup', this.value)" style="margin-bottom:0; width:100%;">
                                    <option value="toddler" ${k.ageGroup === 'toddler' ? 'selected' : ''}>2-3</option>
                                    <option value="preschool" ${k.ageGroup === 'preschool' ? 'selected' : ''}>4-5</option>
                                    <option value="junior" ${k.ageGroup === 'junior' ? 'selected' : ''}>6+</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label style="font-weight:800; font-size:0.9rem; color:#64748b; display:block; margin-bottom:8px;">Choose Avatar</label>
                            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                ${(k.unlockedAvatars || ['👶', '👧', '👦']).map(a => `
                                    <div onclick="app.updateKidProp(${i}, 'avatar', '${a}')" style="font-size:1.8rem; cursor:pointer; width:45px; height:45px; display:flex; align-items:center; justify-content:center; border-radius:12px; border:3px solid var(--border-dark); background:${k.avatar === a ? 'var(--warning)' : 'white'}; transition:all 0.1s;">${a}</div>
                                `).join('')}
                                <button onclick="app.removeKid(${i})" style="margin-left:auto; border:none; background:#fee2e2; width:45px; height:45px; border-radius:12px; cursor:pointer; font-size:1.4rem; border:3px solid #ef4444; display:flex; align-items:center; justify-content:center;">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            updatePin() {
                const pin = document.getElementById('new-pin').value.trim();
                if (pin.length === 4 && /^\d{4}$/.test(pin)) {
                    this.state.parentPin = pin;
                    localStorage.setItem('thaana_parentPin', pin);
                    this.state.pinAttempts = 0;
                    localStorage.setItem('thaana_pinAttempts', '0');
                    this.saveParentPinToDb(pin);
                    this.mascotSay('🔒 PIN updated! Keep it safe.', 4000);
                    document.getElementById('new-pin').value = '';
                    const dropdown = document.getElementById('settings-dropdown');
                    if (dropdown) this.renderSettingsContent(dropdown);
                } else {
                    this.mascotSay('⚠️ Please enter a valid 4-digit PIN (numbers only)!', 3500);
                }
            }

            updateScreenTimeLimit(minutes) {
                const min = parseInt(minutes);
                const editIndex = this.state.editingKidIndex !== undefined ? this.state.editingKidIndex : this.state.activeKidIndex;
                const activeKid = this.state.kids[editIndex];
                if (activeKid) {
                    if (!activeKid.stats) activeKid.stats = {};
                    activeKid.stats.screenTimeLimit = min;
                    activeKid.stats.screenTimeRemaining = min ? min * 60 : null;
                    this.syncKidProgress(editIndex);
                    
                    const dropdown = document.getElementById('settings-dropdown');
                    if (dropdown) this.renderSettingsContent(dropdown);

                    if (min > 0) {
                        this.mascotSay(`⏱️ Screen time set to ${min} minutes!`, 5000);
                    } else {
                        this.mascotSay(`⏱️ Screen time limit disabled.`, 5000);
                    }
                }
            }

            async addNewKid() { 
                const session = await this.supabase.auth.getSession();
                const userId = session.data.session ? session.data.session.user.id : null;
                const newKid = { 
                    user_id: userId, 
                    name: 'ކުއްޖާ', 
                    age_group: 'preschool', 
                    avatar: '👶', 
                    points: 0, 
                    badges: [], 
                    unlocked_avatars: ['👶', '👧', '👦', '🐶', '🐱', '🦁', '🐯', '🐼', '🐨', '🦖', '🦄', '🤖', '👾', '🚀', '⭐'] 
                };
                const { data } = await this.supabase.from('kids').insert(newKid).select().single();
                if (data) {
                    this.state.kids.push({ 
                        dbId: data.id, name: data.name, ageGroup: data.age_group, avatar: data.avatar, 
                        points: data.points, badges: [], 
                        unlockedAvatars: data.unlocked_avatars 
                    });
                    this.state.editingKidIndex = this.state.kids.length - 1;
                    const dropdown = document.getElementById('settings-dropdown');
                    if (dropdown) this.renderSettingsContent(dropdown);
                }
            }

            removeKid(i) { 
                if (this.state.kids.length > 1) { 
                    this.state.kids.splice(i, 1); 
                    if (this.state.activeKidIndex >= this.state.kids.length) this.state.activeKidIndex = 0; 
                    this.state.editingKidIndex = 0;
                    const dropdown = document.getElementById('settings-dropdown');
                    if (dropdown) this.renderSettingsContent(dropdown);
                    this.renderProfileHub();
                } else alert("At least one profile needed!"); 
            }

            updateKidProp(i, prop, val) {
                this.state.kids[i][prop] = val;
                const dropdown = document.getElementById('settings-dropdown');
                if (dropdown) this.renderSettingsContent(dropdown);
                this.renderProfileHub();
                this.syncKidProgress(i);
            }

            updateLanguage(lang) {
                if (lang !== 'dhivehi' && !this.state.isPremium) { this.showUpgradePopup(); this.render(); return; }
                this.state.language = lang;
                localStorage.setItem('thaana_language', lang);
                // Immediately switch to the relevant view for the new language
                if (lang === 'numbers') this.state.view = 'soundboard';
                
                // Keep settings open but re-render content
                const dropdown = document.getElementById('settings-dropdown');
                if (dropdown) this.renderSettingsContent(dropdown);
                
                this.render();
            }

            async logout() {
                if (this.supabase) await this.supabase.auth.signOut();
                this.state.isLoggedIn = false;
                const hub = document.getElementById('hub-dropdown');
                if (hub) hub.remove();
                this.switchView('landing');
            }

            renderSoundboard() {
                const container = document.createElement('div');
                container.style.position = 'relative';

                const grid = document.createElement('div'); grid.className = 'alphabet-grid';
                grid.style.position = 'relative';
                grid.style.zIndex = '1';

                const isNumbers = this.state.language === 'numbers';
                const items = this.state.customContent[this.state.language] || [];
                items.forEach(item => {
                    const isEnglish = this.state.language === 'english';
                    const displayLetter = (isEnglish && item.letter.length === 1) ? item.letter.toUpperCase() + item.letter.toLowerCase() : item.letter;
                    const isDual = displayLetter.length > 1;
                    const card = document.createElement('div'); card.className = 'letter-card'; 
                    
                    if (isNumbers) {
                        card.innerHTML = `
                            <div style="font-size:4rem; font-weight:900; color:var(--primary); line-height:1">${item.letter}</div>
                            <div style="font-size:1.4rem; font-weight:800; color:var(--secondary); margin-top:8px">${item.dhivehi || item.name || ''}</div>
                            <div style="font-size:1.1rem; font-weight:700; color:#475569">${item.english || ''}</div>
                        `;
                        card.onclick = (e) => { 
                            this.playSound('click'); 
                            this.playAudio(item.audio_dhivehi || item.audio); 
                            if (item.audio_english) setTimeout(() => this.playAudio(item.audio_english), 1000);
                            this.createPop(e.pageX, e.pageY); 
                            this.addTaskProgress(); 
                        };
                    } else {
                        card.innerHTML = `<div style="font-size:${isDual ? '2.8rem' : '4rem'}; font-weight:900; letter-spacing:${isDual ? '2px' : 'normal'}">${displayLetter}</div><div style="font-size:1.2rem; font-weight:800">${item.name || item.dhivehi || ''}</div>`;
                        card.onclick = (e) => { this.playSound('click'); this.playAudio(item.audio); this.createPop(e.pageX, e.pageY); this.addTaskProgress(); this.trackBadgeMetric('letterClicks', item.letter); };
                    }
                    grid.appendChild(card);
                });
                container.appendChild(grid);
                this.viewContainer.appendChild(container);
            }


            renderVocabulary() {
                const isNumbers = this.state.language === 'numbers';
                const items = this.state.customContent[isNumbers ? 'numbers' : this.state.language] || [];
                if (!items.length) {
                    this.viewContainer.innerHTML = '<div style="padding:40px; text-align:center; font-weight:900; color:#94a3b8">No content found for this category yet!</div>';
                    return;
                }
                const grid = document.createElement('div'); grid.className = 'alphabet-grid';
                items.forEach(item => {
                    const card = document.createElement('div'); card.className = 'letter-card';
                    if (isNumbers) {
                        card.innerHTML = `
                            <div style="font-size:4rem; font-weight:900; color:var(--primary); line-height:1">${item.letter}</div>
                            <div style="font-size:1.4rem; font-weight:800; color:var(--secondary); margin-top:8px">${item.count_word_dhivehi || item.dhivehi || item.name || 'Count'}</div>
                            <div style="font-size:1.1rem; font-weight:700; color:#475569">${item.count_word_english || item.english || ''}</div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div style="width:100%; aspect-ratio:1; background:#f1f5f9; border-radius:20px; display:flex; align-items:center; justify-content:center; margin-bottom:15px; overflow:hidden">
                                ${item.image ? `<img src="${window.supabaseClient ? window.supabaseClient.storage.from('slips').getPublicUrl(item.image).data.publicUrl : ''}" style="width:100%; height:100%; object-fit:cover">` : '<span style="font-size:3rem">🖼️</span>'}
                            </div>
                            <div style="font-size:1.6rem; font-weight:900; color:var(--secondary)">${item.dhivehi || item.word}</div>
                            <div style="font-size:1rem; color:#64748b; font-weight:700">${item.english}</div>
                        `;
                    }
                    card.onclick = (e) => { 
                        this.playSound('click'); 
                        this.playAudio(isNumbers ? (item.audio_dhivehi || item.audio) : (item.word_audio || item.audio)); 
                        if (isNumbers && item.audio_english) setTimeout(() => this.playAudio(item.audio_english), 1000);
                        this.createPop(e.pageX, e.pageY); 
                    };
                    grid.appendChild(card);
                });
                this.viewContainer.appendChild(grid);
            }

            renderExtra() {
                const lang = this.state.language;
                const items = (this.state.customExtras || []).filter(e => !e.category || e.category === 'all' || e.category === lang);

                const container = document.createElement('div');
                container.style.cssText = 'padding:2rem;';

                const heading = document.createElement('div');
                heading.style.cssText = 'text-align:center; margin-bottom:2rem;';
                heading.innerHTML = `<div style="font-size:2.5rem; font-weight:900; color:var(--border-dark)">📄 Extra Resources</div>
                    <div style="color:#64748b; font-weight:700; margin-top:8px">Worksheets & learning materials</div>`;
                container.appendChild(heading);

                if (!items.length) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'text-align:center; padding:60px 20px; color:#94a3b8; font-size:1.2rem; font-weight:800;';
                    empty.innerHTML = `<div style="font-size:4rem; margin-bottom:15px">📋</div>No extra content yet!<br><span style="font-size:0.9rem; font-weight:600">Check back soon for worksheets and activities.</span>`;
                    container.appendChild(empty);
                    this.viewContainer.appendChild(container);
                    return;
                }

                const grid = document.createElement('div');
                grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:25px;';

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.style.cssText = 'background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);  border:4px solid var(--border-dark); border-radius:25px; box-shadow:6px 6px 0 var(--border-dark); overflow:hidden; transition:transform 0.2s, box-shadow 0.2s; cursor:pointer;';

                    const isImg = item.file_url && /\.(png|jpg|jpeg|gif|webp)/i.test(item.file_url);
                    const isPdf = item.file_url && /\.pdf/i.test(item.file_url);
                    const fileUrl = item.file_url && this.supabase
                        ? this.supabase.storage.from('extras').getPublicUrl(item.file_url).data.publicUrl
                        : (item.file_url || '');

                    let thumbHtml = '';
                    if (item.thumbnail_url && this.supabase) {
                        const thumbSrc = this.supabase.storage.from('extras').getPublicUrl(item.thumbnail_url).data.publicUrl;
                        thumbHtml = `<img src="${thumbSrc}" style="width:100%; height:180px; object-fit:cover; display:block;">`;
                    } else if (isImg) {
                        thumbHtml = `<img src="${fileUrl}" style="width:100%; height:180px; object-fit:cover; display:block;">`;
                    } else {
                        thumbHtml = `<div style="height:140px; background:linear-gradient(135deg,#eff6ff,#dbeafe); display:flex; align-items:center; justify-content:center; font-size:4rem;">${isPdf ? '📄' : '📁'}</div>`;
                    }

                    const filename = item.file_url ? item.file_url.split('/').pop() : 'download';
                    card.innerHTML = `
                        ${thumbHtml}
                        <div style="padding:20px;">
                            <div style="font-size:1.2rem; font-weight:900; color:var(--border-dark); margin-bottom:6px">${item.title || 'Worksheet'}</div>
                            ${item.description ? `<div style="font-size:0.9rem; color:#64748b; font-weight:600; margin-bottom:14px; line-height:1.4">${item.description}</div>` : ''}
                            ${fileUrl ? `<button onclick="app.downloadExtra('${fileUrl}','${filename}')" style="display:inline-block; padding:10px 22px; background:var(--primary); color:white; border-radius:15px; font-weight:900; font-size:0.95rem; border:3px solid var(--border-dark); box-shadow:3px 3px 0 var(--border-dark); cursor:pointer; transition:all 0.2s;">
                                ${isPdf ? '📥 Download PDF' : '📥 Download'}
                            </button>` : ''}
                        </div>`;

                    card.addEventListener('mouseenter', () => { card.style.transform = 'translateY(-4px)'; card.style.boxShadow = '8px 10px 0 var(--border-dark)'; });
                    card.addEventListener('mouseleave', () => { card.style.transform = ''; card.style.boxShadow = '6px 6px 0 var(--border-dark)'; });

                    grid.appendChild(card);
                });

                container.appendChild(grid);
                this.viewContainer.appendChild(container);

                                                let hasCoords = false;

                                                        if (x < minX) minX = x;
                                                        if (x > maxX) maxX = x;
                                                        if (y < minY) minY = y;

            selectColoringTemplate(idx) {
                this.playSound('click');
                this.state.coloringGame = {
                    selectedTemplate: idx,
                    selectedColor: null,
                    coloredRegions: {},
                    isCompleted: false
                };
                this.render();
            }

            selectColoringColor(hex) {
                this.playSound('click');
                this.state.coloringGame.selectedColor = hex;
                
                // Update DOM directly instead of re-rendering to prevent scroll jumping
                document.querySelectorAll('.color-legend-item').forEach(el => {
                    el.style.border = '3px solid #cbd5e1';
                    el.style.background = 'white';
                    const indicator = el.querySelector('.color-legend-active-indicator');
                    if (indicator) indicator.style.display = 'none';
                });
                
                const activeEl = document.getElementById('color-legend-' + hex.slice(1));
                if (activeEl) {
                    activeEl.style.border = '3px solid var(--purple)';
                    activeEl.style.background = '#faf5ff';
                    const indicator = activeEl.querySelector('.color-legend-active-indicator');
                    if (indicator) indicator.style.display = 'inline';
                }
            }

            colorRegionClick(regionId, code, correctHex, e) {
                const game = this.state.coloringGame;
                if (!game) return;
                
                if (!game.selectedColor) {
                    this.playSound('wrong');
                    this.mascotSay("🎨 Choose a color brush from the legend first!");
                    return;
                }

                if (game.selectedColor.toLowerCase() === correctHex.toLowerCase()) {
                    game.coloredRegions[regionId] = game.selectedColor;
                    this.playSound('pop');
                    this.createPop(e.pageX, e.pageY);

                    const el = document.getElementById(regionId);
                    if (el) el.setAttribute('fill', game.selectedColor);

                    const regions = document.querySelectorAll('.coloring-region');
                    let allDone = true;
                    regions.forEach(r => {
                        if (!game.coloredRegions[r.id]) {
                            allDone = false;
                        }
                    });

                    if (allDone && !game.isCompleted) {
                        game.isCompleted = true;
                        this.completeColoringGame();
                    }
                } else {
                    this.playSound('wrong');
                    this.mascotSay(`Oops! The code '${code}' matches a different color. Check the guide! 🧐`, 5000);
                }
            }

                this.playSound('fanfare');

            toggleVideoPlayPause() {
                this.playSound('click');
                const iframe = document.getElementById('yt-player-iframe');
                const indicator = document.getElementById('yt-play-pause-indicator');
                const statusText = document.getElementById('yt-status-text');
                const pulseDot = document.getElementById('yt-pulse-dot');
                if (!iframe) return;

                if (!this.state.isVideoPaused) {
                    // Pause
                    this.state.isVideoPaused = true;
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*');
                    if (indicator) { indicator.innerHTML = '⏸'; indicator.style.opacity = '1'; }
                    if (statusText) statusText.innerText = 'Paused';
                    if (pulseDot) pulseDot.style.animation = 'none';
                } else {
                    // Play
                    this.state.isVideoPaused = false;
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');
                    if (indicator) { indicator.innerHTML = '▶'; indicator.style.opacity = '1'; setTimeout(() => indicator.style.opacity = '0', 800); }
                    if (statusText) statusText.innerText = 'Now Playing';
                    if (pulseDot) pulseDot.style.animation = 'pulse 2s infinite';
                }
            }

            toggleFullScreen() {
                this.playSound('click');
                const container = document.getElementById('yt-player-wrapper');
                if (!container) return;
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                    else if (container.msRequestFullscreen) container.msRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                }
            }

            playVideo(youtube_id) {
                this.playSound('click');
                this.state.activeVideoId = youtube_id;
                this.state.isVideoPaused = false;
                this.render();
                if (youtube_id) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            rewardVideoPoints(youtube_id, category) {
                const activeKid = this.state.kids[this.state.activeKidIndex];
                if (!activeKid.stats) activeKid.stats = {};
                if (!activeKid.stats.watchedVideos) activeKid.stats.watchedVideos = {};

                if (activeKid.stats.watchedVideos[youtube_id]) {
                    this.mascotSay("ℹ️ You already claimed points for watching this video! Try exploring another one! 🌟", 5000);
                    return;
                }

                this.playSound('cheer');
                activeKid.stats.watchedVideos[youtube_id] = true;
                activeKid.stats.videoPointsEarned = (activeKid.stats.videoPointsEarned || 0) + 15;
                
                // Track category view
                if (!activeKid.stats.videoCategoriesWatched) activeKid.stats.videoCategoriesWatched = {};
                activeKid.stats.videoCategoriesWatched[category || 'all'] = true;

                this.addTaskProgress('video', 15);
                this.mascotSay('🌟 Fantastic job! You watched the video and earned +15 points! Keep exploring!', 6000);

                const rBtn = document.getElementById('yt-reward-btn');
                if (rBtn) {
                    rBtn.style.background = '#e2e8f0';
                    rBtn.style.color = '#64748b';
                    rBtn.style.boxShadow = 'none';
                    rBtn.style.cursor = 'default';
                    rBtn.innerHTML = '✅ Already Watched (Points Claimed)';
                    rBtn.onclick = () => {
                        app.mascotSay("ℹ️ You already claimed points for watching this video! Try exploring another one! 🌟", 5000);
                    };
                }
            }

                    const card = document.createElement('div'); card.className = 'letter-card'; card.innerHTML = `<span style="font-size:4rem">ހ${item.mark}</span><div style="font-weight:800">${item.name}</div>`;
                    card.onclick = (e) => { this.playSound('click'); this.playAudio(item.audio); this.createPop(e.pageX, e.pageY); this.trackBadgeMetric('filiClicks', item.mark); };
                    grid.appendChild(card);
                });
                this.viewContainer.appendChild(grid);
            }

                    fontFamily = "'Noto Sans Arabic', sans-serif";
                } else if (this.state.language === 'numbers') {
                    fontFamily = "'Quicksand', sans-serif";
                }

            initTracingCanvas(letter) {

                this.currentStrokeIndex = 0;

                this.userCompletedStrokes = [];

                const isEnglish = this.state.language === 'english' || this.state.language === 'engdhi' || (item && item.category === 'english');

                    <div style="margin:12px auto; max-width:400px">

                            <div id="accuracy-fill" style="height:100%; width:0%; background:linear-gradient(90deg,#FF6B6B 0%,#FFD93D 50%,#6BCB77 100%); border-radius:20px; transition:width 0.2s ease"></div>

                    <div style="margin:16px auto; max-width:400px; background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);  border:3px solid var(--border-dark); border-radius:20px; padding:14px 18px; box-shadow:4px 4px 0 var(--border-dark)">
                        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center">
                            <span style="font-size:0.8rem; font-weight:800; color:#64748b; white-space:nowrap">🎨 Colour</span>
                            <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center">
                                ${ ['#4D96FF','#FF6B6B','#6BCB77','#FFD93D','#FF8400','#9b59b6','#1abc9c','#000000'].map(c =>
                                    `<div id="col-${c.slice(1)}" onclick="app.setTracingColor('${c}')" style="width:30px;height:30px;border-radius:50%;background:${c};border:3px solid ${c==='#4D96FF'?'#000':'transparent'};cursor:pointer;transition:transform 0.15s;box-shadow:0 2px 6px rgba(0,0,0,0.2)" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'"></div>`
                                ).join('')}

                        <button class="nav-btn" style="padding:10px 20px; background:#f8fafc; font-size:1.5rem" onclick="app.prevTracingLetter()">⬅️</button>
                        <button class="start-btn" style="padding:15px 30px; font-size:1.2rem; background:#f0f0f0; color:#64748b; margin:0" onclick="app.playSound('click'); app.clearTracingCanvas()">🗑️ ފޮހެލާ</button>
                        <button class="nav-btn" style="padding:10px 20px; background:#f8fafc; font-size:1.5rem" onclick="app.nextTracingLetter()">➡️</button>

                this.setupTracingCanvas();
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => this.buildReferenceCanvas(letter));
                } else {
                    this.buildReferenceCanvas(letter);

                // Auto-center the tracing box on screen
                setTimeout(() => {
                    const box = document.getElementById('tracing-box');
                    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });

            buildReferenceCanvas(letter) {
                const ref = document.createElement('canvas');
                ref.width = 400; ref.height = 400;
                const rCtx = ref.getContext('2d');

                const draw = () => {
                    const ghostEl = document.getElementById('ghost-letter');
                    const wrapperEl = document.getElementById('tracing-box');

                    let fontSize = 230; 
                    if (ghostEl && wrapperEl) {
                        const wrapperRect = wrapperEl.getBoundingClientRect();
                        if (wrapperRect.width > 0) {
                            const scale = 400 / wrapperRect.width; 
                            const cssFont = parseFloat(getComputedStyle(ghostEl).fontSize);
                            if (!isNaN(cssFont) && cssFont > 0) {
                                fontSize = cssFont * scale;
                            }
                        }
                    }

                    rCtx.clearRect(0, 0, 400, 400);
                    rCtx.fillStyle = '#000';
                    const items = this.state.customContent[this.state.language] || [];
                    const item = items.find(i => i.letter === letter);

                    const isEnglish = this.state.language === 'english' || this.state.language === 'engdhi' || (item && item.category === 'english');
                    const displayLetterForCanvas = (isEnglish && letter.length === 1) ? letter.toUpperCase() + letter.toLowerCase() : letter;
                    const isDual = displayLetterForCanvas.length > 1;
                    const isWide = isEnglish && (letter.toUpperCase() === 'M' || letter.toUpperCase() === 'W');
                    
                    let displaySize = isDual ? Math.round(fontSize * 0.85) : Math.round(fontSize * 1.15); 
                    if (isWide) displaySize = Math.round(fontSize * 0.65);
                    
                    const spacingVal = isDual ? (displaySize * 0.22) : 0;
                    
                    if (item && item.ghost_path) {
                        // Use Vector Path
                        rCtx.strokeStyle = '#000';
                        rCtx.lineWidth = 40; 
                        rCtx.lineCap = 'round';
                        rCtx.lineJoin = 'round';
                        const p = new Path2D(item.ghost_path);
                        rCtx.stroke(p);
                        
                        const ghostEl = document.getElementById('ghost-letter');
                        if (ghostEl) ghostEl.innerHTML = `<svg viewBox="0 0 400 400" style="width:100%; height:100%; fill:none; stroke:#000; stroke-width:40; stroke-linecap:round; opacity:0.13"><path d="${item.ghost_path}" /></svg>`;
                        process();
                    } else if (item && item.ghost_image) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.src = window.supabaseClient ? window.supabaseClient.storage.from('images').getPublicUrl(item.ghost_image).data.publicUrl : item.ghost_image;
                        img.onload = () => {
                            rCtx.drawImage(img, 50, 50, 300, 300);
                            process();
                            const ghostEl = document.getElementById('ghost-letter');
                            if (ghostEl) ghostEl.innerHTML = `<img src="${img.src}" style="width:70%; height:70%; object-fit:contain; opacity:0.3">`;
                        };
                    } else {
                        let fontFamily = "'Quicksand', sans-serif";
                        if (this.state.language === 'dhivehi') {
                            fontFamily = "'dam_madheeh', 'DAM_Madheeh', 'MV Waheed', 'Faruma', 'MVWaheed', 'Mv Eamaan XP', 'A_Waheed', 'Noto Sans Thaana', 'MV Boli', sans-serif";
                        } else if (this.state.language === 'arabic') {
                            fontFamily = "'Noto Sans Arabic', sans-serif";
                        } else if (this.state.language === 'numbers') {
                            fontFamily = "'Quicksand', sans-serif";
                        }
                        rCtx.direction = 'ltr';
                        rCtx.font = `bold ${displaySize}px ${fontFamily}`;
                        rCtx.textAlign = 'center';
                        rCtx.textBaseline = 'middle';
                        if (rCtx.letterSpacing !== undefined) {
                            rCtx.letterSpacing = spacingVal + 'px';
                            rCtx.fillText(displayLetterForCanvas, 200, 200);
                        } else {
                            // Fallback for older browsers
                            rCtx.fillText(displayLetterForCanvas, 200, 200);
                        }
                        process();
                    }
                };

                const process = () => {

                    const imgData = rCtx.getImageData(0, 0, 400, 400).data;
                    const set = new Set();
                    let firstPx = -1;
                    for (let i = 0; i < imgData.length; i += 4) {
                        if (imgData[i + 3] > 40) {
                            set.add(i >> 2);
                            if (firstPx === -1) firstPx = i >> 2;
                        }
                    }
                    this.referencePixels = set;
                };

                const runAfterLayout = () => {
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(() => setTimeout(draw, 50));
                    } else {
                        setTimeout(draw, 600);
                    }
                };
                requestAnimationFrame(() => requestAnimationFrame(runAfterLayout));
            }


            setTracingColor(color) {
                this.tracingColor = color;
                const canvas = document.getElementById('tracing-canvas');
                if (canvas) canvas.getContext('2d').strokeStyle = color;
                document.querySelectorAll('#canvas-area [id^="col-"]').forEach(el => {
                    el.style.border = '3px solid transparent';
                });
                const targetId = 'col-' + color.slice(1);
                const sel = document.getElementById(targetId);
                if (sel) sel.style.border = '3px solid #000';
            }

            parseSvgPath(pathStr) {
                if (!pathStr) return [];
                const strokes = [];
                let currentStroke = [];
                const regex = /([ML])\s*(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g;
                let match;
                while ((match = regex.exec(pathStr)) !== null) {
                    const cmd = match[1];
                    const x = parseFloat(match[2]);
                    const y = parseFloat(match[3]);
                    if (cmd === 'M') {
                        if (currentStroke.length > 0) strokes.push(currentStroke);
                        currentStroke = [{ x, y }];
                    } else if (cmd === 'L') {
                        currentStroke.push({ x, y });
                    }
                }
                if (currentStroke.length > 0) strokes.push(currentStroke);
                return strokes;
            }

            // === Catmull-Rom spline smoothing ===
            smoothStroke(points, segments = 8) {
                if (points.length < 3) return points;
                const result = [];
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[Math.max(i - 1, 0)];
                    const p1 = points[i];
                    const p2 = points[Math.min(i + 1, points.length - 1)];
                    const p3 = points[Math.min(i + 2, points.length - 1)];
                    for (let t = 0; t < segments; t++) {
                        const f = t / segments;
                        const f2 = f * f, f3 = f2 * f;
                        result.push({
                            x: 0.5 * ((2*p1.x) + (-p0.x+p2.x)*f + (2*p0.x-5*p1.x+4*p2.x-p3.x)*f2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*f3),
                            y: 0.5 * ((2*p1.y) + (-p0.y+p2.y)*f + (2*p0.y-5*p1.y+4*p2.y-p3.y)*f2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*f3)
                        });
                    }
                }
                result.push(points[points.length - 1]);
                return result;
            }

            // === Haptic feedback for boundary errors (mobile) ===
            vibrateError() {
                try { if (navigator.vibrate) navigator.vibrate([30, 20, 30]); } catch(e) {}
            }

            // === Animated SVG hint that shows the path once before tracing ===
            showTraceHint() {
                const box = document.getElementById('tracing-box');
                if (!box || !this.tracingStrokes || this.tracingStrokes.length === 0) return;

                // Remove any previous hint
                const prev = box.querySelector('.tracing-hint-overlay');
                if (prev) prev.remove();

                // Build SVG path string from tracingStrokes
                let d = '';
                this.tracingStrokes.forEach(stroke => {
                    if (stroke.length === 0) return;
                    d += `M ${stroke[0].x} ${stroke[0].y} `;
                    for (let i = 1; i < stroke.length; i++) {
                        d += `L ${stroke[i].x} ${stroke[i].y} `;
                    }
                });
                if (!d) return;

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 400 400');
                svg.classList.add('tracing-hint-overlay');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', '#22c55e');
                path.setAttribute('stroke-width', '6');
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('stroke-dasharray', '12 8');
                svg.appendChild(path);
                box.appendChild(svg);

                // Animate: trace the dashed path then fade out
                requestAnimationFrame(() => {
                    const len = path.getTotalLength();
                    path.style.strokeDasharray = len;
                    path.style.strokeDashoffset = len;
                    path.style.setProperty('--path-len', len);
                    path.style.animation = `hintDraw 2.5s ease forwards`;
                });

                // Remove after animation
                setTimeout(() => {
                    svg.classList.add('fade-out');
                    setTimeout(() => svg.remove(), 600);
                }, 2800);
            }

            // === Position the DOM-based pulsating guide dot ===
            updateGuideDot() {
                const box = document.getElementById('tracing-box');
                if (!box) return;
                let dot = box.querySelector('.tracing-guide-dot');

                if (!this.tracingStrokes || this.tracingStrokes.length === 0 ||
                    this.currentStrokeIndex >= this.tracingStrokes.length) {
                    if (dot) dot.style.display = 'none';
                    return;
                }

                const stroke = this.tracingStrokes[this.currentStrokeIndex];
                const target = stroke[Math.min(this.currentPointIndex, stroke.length - 1)];
                const rect = box.getBoundingClientRect();
                const scaleX = rect.width / 400;
                const scaleY = rect.height / 400;

                if (!dot) {
                    dot = document.createElement('div');
                    dot.className = 'tracing-guide-dot';
                    dot.innerHTML = '🦀<div class="guide-arrow" style="position:absolute; bottom:-12px; font-size:1.1rem; color:#22c55e; text-shadow:0 0 3px white; transition:transform 0.15s">➔</div>';
                    box.appendChild(dot);
                }
                dot.style.display = 'block';
                dot.style.left = (target.x * scaleX) + 'px';
                dot.style.top  = (target.y * scaleY) + 'px';

                // Directional Guide Arrow
                const nextTarget = stroke[Math.min(this.currentPointIndex + 5, stroke.length - 1)];
                const arrow = dot.querySelector('.guide-arrow');
                if (arrow && nextTarget && (nextTarget.x !== target.x || nextTarget.y !== target.y)) {
                    const angle = Math.atan2(nextTarget.y - target.y, nextTarget.x - target.x);
                    const deg = angle * (180 / Math.PI);
                    arrow.style.transform = `rotate(${deg}deg)`;
                    arrow.style.display = 'block';
                } else if (arrow) {
                    arrow.style.display = 'none';
                }
            }

            drawTracingGuides() {
                const canvas = document.getElementById('tracing-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 400, 400);

                ctx.lineWidth = this.tracingBrushSize || 32;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Helper: draw a smoothed stroke array
                const drawSmoothed = (points) => {
                    if (!points || points.length === 0) return;
                    const smooth = points.length >= 3 ? this.smoothStroke(points, 6) : points;
                    ctx.beginPath();
                    ctx.moveTo(smooth[0].x, smooth[0].y);
                    for (let i = 1; i < smooth.length; i++) {
                        ctx.lineTo(smooth[i].x, smooth[i].y);
                    }
                    ctx.stroke();
                };

                // 1. Draw completed strokes (smoothed)
                ctx.strokeStyle = this.tracingColor;
                if (this.userCompletedStrokes) {
                    this.userCompletedStrokes.forEach(drawSmoothed);
                }

                // 2. Draw current active stroke (smoothed)
                if (this.userCurrentStroke && this.userCurrentStroke.length > 0) {
                    drawSmoothed(this.userCurrentStroke);
                }

                // 3. Update DOM guide dot position
                this.updateGuideDot();
            }


            setupTracingCanvas() {
                const canvas = document.getElementById('tracing-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                this.tracingColor = this.tracingColor || '#4D96FF';
                this.tracingBrushSize = 32;
                ctx.lineWidth = this.tracingBrushSize;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = this.tracingColor;
                let drawing = false, lx = 0, ly = 0;
                let lastUpdate = 0;
                let lastAccuracyPct = 0;
                let rect = canvas.getBoundingClientRect(); 
                let scaleX = 400 / rect.width, scaleY = 400 / rect.height;

                // Show animated hint path on first load
                setTimeout(() => this.showTraceHint(), 400);
                // Initialize guide dot
                setTimeout(() => this.updateGuideDot(), 500);

                const pos = (e) => {
                    const src = e.touches ? e.touches[0] : e;
                    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
                };

                const isCursorInsideLetter = (cx, cy, tolerance = 24) => {
                    if (!this.referencePixels) return true;
                    const cxRound = Math.round(cx);
                    const cyRound = Math.round(cy);
                    
                    if (this.referencePixels.has(cyRound * 400 + cxRound)) return true;
                    
                    const tolSq = tolerance * tolerance;
                    for (let dx = -tolerance; dx <= tolerance; dx += 2) {
                        for (let dy = -tolerance; dy <= tolerance; dy += 2) {
                            if (dx * dx + dy * dy <= tolSq) {
                                const px = cxRound + dx;
                                const py = cyRound + dy;
                                if (px >= 0 && px < 400 && py >= 0 && py < 400) {
                                    if (this.referencePixels.has(py * 400 + px)) {
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                    return false;
                };

                const triggerOutsideWarning = (msgType) => {
                    this.playSound('wrong');
                    this.vibrateError(); // Haptic feedback on mobile
                    
                    // CSS-animated border flash
                    const box = document.getElementById('tracing-box');
                    if (box) {
                        box.classList.remove('border-flash');
                        void box.offsetWidth; // force reflow
                        box.classList.add('border-flash');
                        box.addEventListener('animationend', () => box.classList.remove('border-flash'), { once: true });
                    }
                    
                    // Animated feedback message
                    const fb = document.getElementById('tracing-feedback');
                    let msg = "";
                    if (msgType === 'start') {
                        msg = "Start inside the letter! ✏️";
                        if (this.state.language === 'dhivehi') msg = "އަކުރުގެ އެތެރެއިން ފަށާ! ✏️";
                        else if (this.state.language === 'arabic') msg = "ابدأ من داخل الحرف! ✏️";
                    } else {
                        msg = "Oops! Stay inside the lines! ✏️";
                        if (this.state.language === 'dhivehi') msg = "އައުޗް! ރޮނގުން ބޭރަށް ނުދޭ! ✏️";
                        else if (this.state.language === 'arabic') msg = "عذراً! ابقَ داخل الخطوط! ✏️";
                    }
                    if (fb) fb.innerHTML = `<span class="tracing-feedback-msg" style="color:#ef4444">${msg}</span>`;
                };

                const start = (e) => {
                    e.preventDefault(); 
                    rect = canvas.getBoundingClientRect(); 
                    scaleX = 400 / rect.width; scaleY = 400 / rect.height;
                    const p = pos(e);
                    
                    if (!isCursorInsideLetter(p.x, p.y)) {
                        triggerOutsideWarning('start');
                        return;
                    }
                    
                    drawing = true;
                    lx = p.x; ly = p.y;

                    // Initialize new stroke
                    this.userCurrentStroke = [{ x: lx, y: ly }];

                    this.trackBadgeMetric('colorsUsed', this.tracingColor);
                    
                    // Remove hint overlay when user starts drawing
                    const hint = document.querySelector('.tracing-hint-overlay');
                    if (hint) { hint.classList.add('fade-out'); setTimeout(() => hint.remove(), 600); }
                    
                    // Clear error message
                    const fb = document.getElementById('tracing-feedback');
                    if (fb) fb.innerHTML = '';

                    // Redraw with smoothing
                    this.drawTracingGuides();
                };

                const move = (e) => {
                    if (!drawing) return; e.preventDefault();
                    const p = pos(e);
                    
                    const steps = Math.max(1, Math.ceil(Math.hypot(p.x - lx, p.y - ly) / 8)); 
                    const br = Math.ceil(this.tracingBrushSize / 2);
                    const brSq = br * br;
                    
                    let wentOutside = false;
                    let lastBx = lx;
                    let lastBy = ly;
                    
                    for (let s = 0; s <= steps; s++) {
                        const bx = Math.round(lx + (p.x - lx) * s / steps);
                        const by = Math.round(ly + (p.y - ly) * s / steps);
                        
                        if (!isCursorInsideLetter(bx, by)) {
                            wentOutside = true;
                            break;
                        }
                        
                        lastBx = bx;
                        lastBy = by;
                        
                        for (let dx = -br; dx <= br; dx += 2) { 
                            for (let dy = -br; dy <= br; dy += 2) {
                                if (dx*dx + dy*dy <= brSq) {
                                    const px = bx + dx, py = by + dy;
                                    if (px >= 0 && px < 400 && py >= 0 && py < 400) {
                                        const idx = py * 400 + px;
                                        if (!this.drawnPixels.has(idx)) {
                                            if (this.referencePixels && this.referencePixels.has(idx)) {
                                                this.coveredCount++;
                                            }
                                            this.drawnPixels.add(idx);
                                        }
                                    }
                                }
                            }
                        }
                    }
                    
                    if (wentOutside) {
                        // Add last valid point to stroke
                        this.userCurrentStroke.push({ x: lastBx, y: lastBy });
                        this.userCompletedStrokes.push([...this.userCurrentStroke]);
                        this.userCurrentStroke = [];
                        drawing = false;
                        triggerOutsideWarning('move');
                        this.drawTracingGuides();
                        return;
                    }
                    
                    // Add point to current stroke
                    this.userCurrentStroke.push({ x: p.x, y: p.y });
                    lx = p.x; ly = p.y;

                    // Redraw everything with smooth strokes
                    this.drawTracingGuides();
                    
                    const now = Date.now();
                    if (now - lastUpdate > 100) {
                        this.updateAccuracyBar(lastAccuracyPct);
                        lastUpdate = now;
                    }
                };

                const stop = () => { 
                    if (drawing) {
                        drawing = false;
                        // Complete the stroke
                        if (this.userCurrentStroke && this.userCurrentStroke.length > 0) {
                            this.userCompletedStrokes.push([...this.userCurrentStroke]);
                            this.userCurrentStroke = [];
                        }
                        this.drawTracingGuides();
                        this.checkTracingAccuracy();
                    }
                };
                canvas.addEventListener('mousedown', start);
                canvas.addEventListener('mousemove', move);
                canvas.addEventListener('mouseup', stop);
                canvas.addEventListener('mouseleave', stop);
                canvas.addEventListener('touchstart', start, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                canvas.addEventListener('touchend', stop);
            }

            updateAccuracyBar(prevPct) {
                if (!this.referencePixels || !this.referencePixels.size) return;
                const pct = Math.min(100, Math.round(this.coveredCount / this.referencePixels.size * 100));
                const fill = document.getElementById('accuracy-fill');
                const pctEl = document.getElementById('accuracy-pct');
                if (fill) {
                    fill.style.width = pct + '%';
                    // Pop animation at milestones (every 25%)
                    if (prevPct !== undefined && Math.floor(pct / 25) > Math.floor(prevPct / 25)) {
                        fill.classList.remove('pop');
                        void fill.offsetWidth;
                        fill.classList.add('pop');
                    }
                }
                if (pctEl) pctEl.textContent = pct + '%';
                return pct;
            }

            clearTracingCanvas() {
                const canvas = document.getElementById('tracing-canvas');
                if (canvas) canvas.getContext('2d').clearRect(0, 0, 400, 400);
                this.drawnPixels = new Set();
                this.coveredCount = 0;
                this.userCompletedStrokes = [];
                this.userCurrentStroke = [];
                this.currentStrokeIndex = 0;
                this.currentPointIndex = 0;
                const fill = document.getElementById('accuracy-fill');
                const pctEl = document.getElementById('accuracy-pct');
                if (fill) fill.style.width = '0%';
                if (pctEl) pctEl.textContent = '0%';
                const fb = document.getElementById('tracing-feedback');
                if (fb) fb.innerHTML = '';
                // Re-show guide dot and hint
                this.updateGuideDot();
                setTimeout(() => this.showTraceHint(), 200);
            }

            checkTracingAccuracy() {
                if (!this.referencePixels || !this.referencePixels.size) {
                    this.triggerExplosion(); this.addTaskProgress(); return;
                }
                const pct = Math.min(100, Math.round(this.coveredCount / this.referencePixels.size * 100));
                this.updateAccuracyBar(0);
                const fb = document.getElementById('tracing-feedback');
                if (pct >= 50) {
                    if (fb) fb.innerHTML = `<span class="tracing-feedback-msg" style="color:#22c55e">🌟 ވަރަށް ރަނގަޅު! ${pct}% traced correctly!</span>`;
                    this.triggerExplosion();
                    this.addTaskProgress();
                    const items = this.state.customContent[this.state.language] || [];
                    const next = items[items.findIndex(i => i.letter === this.currentTracingLetter) + 1] || items[0];
                    setTimeout(() => { if (this.state.view === 'tracing') this.initTracingCanvas(next.letter); }, 2000);
                } else if (pct >= 35) {
                    if (fb) fb.innerHTML = `<span class="tracing-feedback-msg" style="color:var(--orange)">👍 Almost! ${pct}% — Try to cover more of the letter!</span>`;
                } else {
                    if (fb) fb.innerHTML = `<span class="tracing-feedback-msg" style="color:#ef4444">✏️ Keep practicing! Only ${pct}% — Follow the ghost letter outline!</span>`;
                }
            }

            nextQuizQuestion() {
                this.isAnsweringQuiz = false;
                // Clear any previous quiz timeouts and stop playing audio
                if (this.quizAudioTimeouts) {
                    this.quizAudioTimeouts.forEach(clearTimeout);
                    this.quizAudioTimeouts = [];
                } else {
                    this.quizAudioTimeouts = [];
                }
                for (const key in this.audioPool) {
                    if (this.audioPool[key]) {
                        try {
                            this.audioPool[key].pause();
                            this.audioPool[key].currentTime = 0;
                        } catch(e) {}
                    }
                }

                const items = (this.state.customContent[this.state.language] || []).filter(i => i.image);
                if (!items.length) {
                    document.getElementById('quiz-options').innerHTML = `<p style="grid-column:1/-1; color:#94a3b8; font-size:1rem">Waiting for quiz content...</p>`;
                    return;
                }
                const target = items[Math.floor(Math.random() * items.length)];
                const pool = this.state.customContent[this.state.language] || [];
                
                let options = [];
                const correctAnswerStr = (target.quiz_answer || target.letter || '').trim();

                if (target.quiz_options) {
                    const customOpts = target.quiz_options.split(/[,،]+/).map(s => s.trim()).filter(s => s);
                    if (customOpts.length > 0) {
                        options = customOpts.map(opt => ({ label: opt, isCorrect: opt === correctAnswerStr }));
                    }
                }

                if (options.length === 0) {
                    options = [{ label: correctAnswerStr, isCorrect: true }];
                    while (options.length < 4 && options.length < pool.length) { 
                        const r = pool[Math.floor(Math.random() * pool.length)]; 
                        const rLabel = (r.letter || '').trim();
                        if (!options.find(o => o.label === rLabel)) {
                            options.push({ label: rLabel, isCorrect: false });
                        }
                    }
                }
                options.sort(() => Math.random() - 0.5);
                const imgUrl = target.image && window.supabaseClient
                    ? window.supabaseClient.storage.from('images').getPublicUrl(target.image).data.publicUrl
                    : `https://placehold.co/200?text=${encodeURIComponent(target.word || target.letter)}`;
                const quizImg = document.getElementById('quiz-img');
                quizImg.src = imgUrl;
                quizImg.onerror = () => quizImg.src = `https://placehold.co/200/e2e8f0/64748b?text=${encodeURIComponent(target.word || target.letter)}`;
                
                const titleEl = document.getElementById('quiz-title');
                if (titleEl) titleEl.textContent = target.quiz_question || this.t('What is this letter?');

                // Auto-play question audio, then answer audios sequentially
                this.quizSequenceId = Date.now();
                const currentSeq = this.quizSequenceId;
                
                const playQuizAudio = async () => {
                    const qAudio = target.quiz_audio || target.audio_dhivehi || target.audio;
                    if (qAudio) await this.playAudio(qAudio, true);
                    
                    if (this.quizSequenceId !== currentSeq) return;
                    await new Promise(r => setTimeout(r, 600));
                    
                    for (const opt of options) {
                        if (this.quizSequenceId !== currentSeq) return;
                        const optItem = (this.state.customContent[this.state.language] || []).find(i => (i.letter || '').trim() === opt.label.trim());
                        if (optItem) {
                            const optAudio = optItem.quiz_audio || optItem.audio_dhivehi || optItem.audio;
                            if (optAudio) {
                                await this.playAudio(optAudio, true);
                                if (this.quizSequenceId !== currentSeq) return;
                                await new Promise(r => setTimeout(r, 600));
                            }
                        }
                    }
                };
                
                setTimeout(() => {
                    if (this.quizSequenceId === currentSeq) playQuizAudio();
                }, 400);

                const grid = document.getElementById('quiz-options'); grid.innerHTML = '';
                options.forEach(opt => {
                    const btn = document.createElement('button'); btn.className = 'start-btn'; btn.innerText = opt.label; btn.style.background = 'var(--pink)';
                    // Play option audio on hover for reference
                    btn.onmouseenter = () => {
                        const optItem = (this.state.customContent[this.state.language] || []).find(i =>
                            (i.letter || '').trim() === opt.label.trim()
                        );
                        if (optItem) {
                            const optAudio = optItem.quiz_audio || optItem.audio_dhivehi || optItem.audio;
                            if (optAudio) this.playAudio(optAudio);
                        }
                    };
                    btn.onclick = () => { 
                        if (this.isAnsweringQuiz) return;
                        this.playSound('click'); 
                        if (opt.isCorrect) { 
                            this.isAnsweringQuiz = true;
                            this.triggerExplosion(); 
                            try { this.addTaskProgress(); } catch(e) { console.error(e); }
                            setTimeout(() => this.nextQuizQuestion(), 1500); 
                        } else {
                            btn.style.background = '#fca5a5';
                            this.playSound('wrong');
                        }
                    };
                    grid.appendChild(btn);
                });
            }

            trackBadgeMetric(metric, value) {
                const kid = this.state.kids[this.state.activeKidIndex];
                if (!kid.stats) kid.stats = {};
                if (metric === 'wordCardsClicked') {
                    kid.stats.wordCardsClicked = (kid.stats.wordCardsClicked || 0) + 1;
                } else if (metric === 'numbersClicked') {
                    if (!kid.stats.numbersClicked) kid.stats.numbersClicked = {};
                    kid.stats.numbersClicked[value] = true;
                } else if (metric === 'wordSoundsListened') {
                    if (!kid.stats.wordSoundsListened) kid.stats.wordSoundsListened = {};
                    kid.stats.wordSoundsListened[value] = true;
                    kid.stats.totalAudioListened = (kid.stats.totalAudioListened || 0) + 1;
                } else if (metric === 'colorsUsed') {
                    if (!kid.stats.colorsUsed) kid.stats.colorsUsed = {};
                    kid.stats.colorsUsed[value] = true;
                } else if (metric === 'filiClicks') {
                    kid.stats.filiClicks = (kid.stats.filiClicks || 0) + 1;
                    kid.stats.totalAudioListened = (kid.stats.totalAudioListened || 0) + 1;
                } else if (metric === 'letterClicks') {
                    kid.stats.letterClicks = (kid.stats.letterClicks || 0) + 1;
                    kid.stats.totalAudioListened = (kid.stats.totalAudioListened || 0) + 1;
                } else if (metric === 'mysteryBoxesOpened') {
                    kid.stats.mysteryBoxesOpened = (kid.stats.mysteryBoxesOpened || 0) + 1;
                } else if (metric === 'dinoJumpsPlayed') {
                    kid.stats.dinoJumpsPlayed = (kid.stats.dinoJumpsPlayed || 0) + 1;
                } else if (metric === 'tabVisited') {
                    if (!kid.stats.tabsVisited) kid.stats.tabsVisited = {};
                    kid.stats.tabsVisited[value] = true;
                } else if (metric === 'activeDay') {
                    if (!kid.stats.activeDaysMap) kid.stats.activeDaysMap = {};
                    if (!kid.stats.activeDaysMap[value]) {
                        kid.stats.activeDaysMap[value] = true;
                        kid.stats.activeDaysCount = Object.keys(kid.stats.activeDaysMap).length;
                    }
                }
                this.checkBadges(kid);
                this.syncKidProgress();
            }

            playAudio(filename, preserveSequence = false) {
                return new Promise((resolve) => {
                    if (!filename) return resolve();
                    
                    if (!preserveSequence) {
                        this.stopAllAudio();
                    } else {
                        // Stop audio but preserve quiz sequence
                        for (const key in this.audioPool) {
                            if (this.audioPool[key]) {
                                try {
                                    this.audioPool[key].pause();
                                    this.audioPool[key].currentTime = 0;
                                } catch(e) {}
                            }
                        }
                    }
                    
                    const cleanFilename = filename.trim();
                    const url = window.supabaseClient ? window.supabaseClient.storage.from('audio').getPublicUrl(cleanFilename).data.publicUrl : `assets/audio/${cleanFilename}`;
                    if (!this.audioPool[url]) this.audioPool[url] = new Audio(url);
                    const audio = this.audioPool[url];
                    audio.currentTime = 0;
                    
                    const onEnded = () => {
                        audio.removeEventListener('ended', onEnded);
                        audio.removeEventListener('pause', onEnded);
                        resolve();
                    };
                    audio.addEventListener('ended', onEnded);
                    audio.addEventListener('pause', onEnded);
                    
                    audio.play().catch((e) => {
                        console.log("Audio play blocked:", e);
                        audio.removeEventListener('ended', onEnded);
                        audio.removeEventListener('pause', onEnded);
                        resolve();
                    });
                });
            }

                this.quizSequenceId = null;
                if (this.quizAudioTimeouts) {
                    this.quizAudioTimeouts.forEach(clearTimeout);

                for (const key in this.audioPool) {

                        } catch(e) {}

                }
            }

                const colors = ['#FFD93D', '#FF6B6B', '#4D96FF', '#6BCB77', '#FF8400', '#e0c3fc', '#9b59b6', '#1abc9c'];
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 60; i++) {

                    const angle = Math.random() * Math.PI * 2; const distance = 150 + Math.random() * 450;

            async downloadExtra(url, filename) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Network error');
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename || 'download';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                } catch (err) {
                    // Fallback: open in new tab if fetch fails
                    window.open(url, '_blank');
                }
            }

                const items = this.state.customContent[this.state.language] || [];
                const idx = items.findIndex(i => i.letter === this.currentTracingLetter);
                const prev = items[idx - 1] || items[items.length - 1];
                if (prev) this.initTracingCanvas(prev.letter);
            }

            nextTracingLetter() {
                const items = this.state.customContent[this.state.language] || [];
                const idx = items.findIndex(i => i.letter === this.currentTracingLetter);
                const next = items[idx + 1] || items[0];
                if (next) this.initTracingCanvas(next.letter);
            }
        }
        const app = new App();
        
        // Mobile Header Scroll Listener
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.app-header');
            if (window.innerWidth <= 850) {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    header.classList.add('header-hidden');
                } else {
                    header.classList.remove('header-hidden');
                }
                lastScrollTop = scrollTop;
            } else {
                header.classList.remove('header-hidden');
            }
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW Registered!', reg);
                }).catch(err => {
                    console.log('SW Registration failed:', err);
                });
            });
        }
        let ctx;
        function initCanvas(id) { const canvas = document.getElementById(id); ctx = canvas.getContext('2d'); let drawing = false; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.strokeStyle = '#4D96FF'; canvas.onmousedown = () => { drawing = true; ctx.beginPath(); }; canvas.onmouseup = () => { drawing = false; }; canvas.onmousemove = (e) => { if (!drawing) return; const rect = canvas.getBoundingClientRect(); ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke(); }; }
    </script>
</body>
