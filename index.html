<!DOCTYPE html>
<html lang="dv" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thaana Kids - Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Prevent zooming on mobile */
        html, body { touch-action: manipulation; overscroll-behavior: none; }
        .hall-container, .fame-list { touch-action: pan-y; }

        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .profile-hub-pill { display: flex; align-items: center; gap: 12px; background: white; border: 3px solid var(--border-dark); border-radius: 50px; padding: 6px 16px 6px 8px; cursor: pointer; transition: all 0.2s; position: relative; box-shadow: 0 4px 0 var(--border-dark); }
        .profile-hub-pill:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--border-dark); }
        .hub-avatar { width: 42px; height: 42px; background: var(--warning); border-radius: 50%; border: 3px solid var(--border-dark); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .hub-info { display: flex; flex-direction: column; line-height: 1.1; }
        .hub-name { font-weight: 900; font-size: 0.95rem; color: #1e293b; }
        .hub-points { font-weight: 800; font-size: 0.75rem; color: #64748b; }
        .hub-chevron { font-size: 0.7rem; color: #94a3b8; margin-left: 4px; }
        .premium-badge { position: absolute; top: -10px; left: -10px; font-size: 1.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .hub-action-btn { width: 100%; padding: 12px; border-radius: 16px; border: 3px solid var(--border-dark); background: #f8fafc; color: #1e293b; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
        .hub-action-btn:hover { background: #f1f5f9; transform: translateY(-2px); }
        .hub-action-btn.premium { background: var(--orange); color: white; border-color: #d97706; }
        .hub-action-btn.logout { color: #ef4444; border-color: #fca5a5; }
        .lang-opt { padding: 15px; border-radius: 20px; border: 3px solid #e2e8f0; background: white; font-weight: 900; font-size: 1rem; cursor: pointer; transition: all 0.2s; color: #475569; position: relative; text-align: center; }
        .lang-opt.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); box-shadow: 0 4px 0 var(--primary); transform: translateY(-2px); }
        .lang-opt:hover:not(.active) { border-color: var(--primary-light); background: #f8fafc; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>

<body data-lang="dhivehi">
    <div id="bg-decoration"></div>
    <div id="transition-overlay"></div>
    <div id="confetti-container"></div>
    <div id="toast-container"></div>

    <div id="app">
        <header class="app-header">
            <div class="logo" id="logo-home" style="cursor:pointer">
                <span class="icon">🎨</span>
                <span class="thaana-text">ތާނަ</span>
                <span class="english-text">Kids</span>
            </div>

            <nav class="main-nav" id="main-nav"></nav>

            <div class="header-right">
                <div id="profile-hub-container"></div>
            </div>
        </header>

        <main id="view-container"></main>

        <div class="app-helper" id="app-helper" style="display:none; pointer-events:none;">
            <div class="app-bubble" id="app-bubble" style="pointer-events:auto;"></div>
        </div>

        <div class="mystery-box-container" id="mystery-box-widget" style="display:none">
            <div class="mystery-box" id="mystery-box">🎁</div>
        </div>

        <footer class="app-footer"
            style="padding: 2rem; text-align: center; border-top: 4px solid var(--border-dark); background: white;">
            <p id="footer-text">© 2026 ތާނަ އެކަޑަމީ - މޯލްޑިވްސް</p>
        </footer>
    </div>

    <div id="modal-container"></div>

    <script src="content.js"></script>
    <script>
        // Global Supabase Initialization
        const sbUrl = (typeof CONFIG !== 'undefined') ? CONFIG.SUPABASE_URL : (window.CONFIG ? window.CONFIG.SUPABASE_URL : 'YOUR_SUPABASE_URL');
        const sbKey = (typeof CONFIG !== 'undefined') ? CONFIG.SUPABASE_KEY : (window.CONFIG ? window.CONFIG.SUPABASE_KEY : 'YOUR_SUPABASE_ANON_KEY');
        window.supabaseClient = null;
        try {
            if (sbUrl !== 'YOUR_SUPABASE_URL' && typeof supabase !== 'undefined') {
                window.supabaseClient = supabase.createClient(sbUrl, sbKey);
            } else {
                console.warn("Supabase not initialized globally. Missing config or CDN.");
            }
        } catch (e) {
            console.error("Supabase Global Init Error:", e);
        }

        class App {
            constructor() {
                // Cloud Sync (Supabase)
                this.supabase = window.supabaseClient;

                // Sync settings from LocalStorage (managed by admin.html)
                const savedSettings = JSON.parse(localStorage.getItem('thaana_settings')) || {
                    siteName: 'Thaana Kids',
                    premiumPrice: '200 MVR',
                    bankAccount: '7730000053982',
                    bankName: 'Mohamed Aleef',
                    heroTitle: 'Learn & Play! 🎨',
                    heroSubtitle: 'Start your journey to become a star learner!',
                    heroBtnText: 'Get Started! 🚀',
                    heroEmoji: '🎨',
                    footerText: '© 2026 ތާނަ އެކަޑަމީ - މޯލްޑިވްސް'
                };

                // Automated Premium Check (Removal if expired)
                let isPremium = localStorage.getItem('thaana_isPremium') === 'true';
                const premiumExpiry = localStorage.getItem('thaana_premiumExpiry');
                if (isPremium && premiumExpiry) {
                    const expiryDate = new Date(parseInt(premiumExpiry));
                    if (Date.now() > expiryDate.getTime()) {
                        isPremium = false;
                        localStorage.setItem('thaana_isPremium', 'false');
                        localStorage.removeItem('thaana_premiumExpiry');
                        console.log("Premium subscription expired.");
                    }
                }

                // Dynamic Content & Nav Initialization
                const defaultNav = [
                    { id: 'soundboard', icon: '🔊', label: 'Letters', premium: false },
                    { id: 'fili', icon: '✨', label: 'Fili', premium: true },
                    { id: 'tracing', icon: '✏️', label: 'Tracing', premium: true },
                    { id: 'vocabulary', icon: '🖼️', label: 'Words', premium: true },
                    { id: 'numbers', icon: '🔢', label: 'Numbers', premium: true },
                    { id: 'quiz', icon: '⭐', label: 'Quiz', premium: true },
                    { id: 'extra', icon: '📄', label: 'Extra', premium: false },
                    { id: 'hall', icon: '🏆', label: 'Hall', premium: true },
                    { id: 'badges', icon: '🏅', label: 'Badges', premium: true }
                ];

                this.state = {
                    view: 'landing',
                    language: localStorage.getItem('thaana_language') || 'dhivehi',
                    isPremium: isPremium,
                    isLoggedIn: false,
                    parentEmail: 'parent@example.com',
                    parentPin: localStorage.getItem('thaana_parentPin') || '2345',
                    hallFilter: 'monthly',
                    seasonName: localStorage.getItem('thaana_seasonName') || 'Season 1',
                    seasonEnd: localStorage.getItem('thaana_seasonEnd') || '',
                    seasonDaysLeft: 90,
                    kids: [
                        { name: 'ކުޑަކުއްޖާ', ageGroup: 'preschool', avatar: '👶', points: 0, seasonPoints: 0, monthlyPoints: 0, weeklyPoints: 0, dailyPoints: 0, badges: [1], unlockedAvatars: ['👶', '👧', '👦'] }
                    ],
                    activeKidIndex: 0,
                    dailyGameCount: 0,
                    maxDailyGames: 3,
                    timeLeft: 60,
                    globalSettings: savedSettings,
                    customNav: JSON.parse(localStorage.getItem('thaana_nav')) || defaultNav,
                    customContent: JSON.parse(localStorage.getItem('thaana_content')) || content,
                    customFili: JSON.parse(localStorage.getItem('thaana_fili')) || filiData,
                    customExtras: [],
                    mascotShowsToday: parseInt(localStorage.getItem('thaana_mascotShows')) || 0,
                    mascotLastDate: localStorage.getItem('thaana_mascotDate') || ''
                };

                // Add numbers to content if missing
                if (!this.state.customContent.numbers) {
                    this.state.customContent.numbers = content.numbers;
                }

                // Sync to localStorage if first run
                if (!localStorage.getItem('thaana_content')) {
                    localStorage.setItem('thaana_content', JSON.stringify(content));
                    localStorage.setItem('thaana_fili', JSON.stringify(filiData));
                    localStorage.setItem('thaana_nav', JSON.stringify(defaultNav));
                }

                this.viewContainer = document.getElementById('view-container');
                this.mainNav = document.getElementById('main-nav');
                this.audioPool = {};
                this.init();
            }

            init() {
                document.getElementById('mystery-box').onclick = () => { this.playSound('click'); this.openMysteryBox(); };
                this.initDecorations();
                this.initMascotTracking();
                this.initSeasonAndResets();
                this.render();
                this.initSupabase();
            }

            initMascotTracking() {
                const today = new Date().toDateString();
                if (this.state.mascotLastDate !== today) {
                    this.state.mascotShowsToday = 0;
                    this.state.mascotLastDate = today;
                    localStorage.setItem('thaana_mascotDate', today);
                    localStorage.setItem('thaana_mascotShows', 0);
                }
            }

            initSeasonAndResets() {
                const now = new Date();
                const todayStr = now.toDateString();
                
                // 1. Daily Reset (00:00)
                const lastDaily = localStorage.getItem('thaana_lastDailyReset') || '';
                if (lastDaily !== todayStr) {
                    localStorage.setItem('thaana_lastDailyReset', todayStr);
                    this.state.kids.forEach(k => k.dailyPoints = 0);
                }

                // 2. Weekly Reset (Every Friday)
                // getDay() === 5 is Friday. We store the date string of the most recent Friday.
                let lastFriday = new Date(now);
                const dayOfWeek = now.getDay();
                const diffToFriday = (dayOfWeek < 5) ? (dayOfWeek + 2) : (dayOfWeek - 5);
                lastFriday.setDate(now.getDate() - diffToFriday);
                const fridayStr = lastFriday.toDateString();

                const lastWeekly = localStorage.getItem('thaana_lastWeeklyReset') || '';
                if (lastWeekly !== fridayStr) {
                    localStorage.setItem('thaana_lastWeeklyReset', fridayStr);
                    this.state.kids.forEach(k => k.weeklyPoints = 0);
                }

                // 3. Monthly Reset
                const currentMonthStr = `${now.getFullYear()}-${now.getMonth()}`;
                const lastMonthly = localStorage.getItem('thaana_lastMonthlyReset') || '';
                if (lastMonthly !== currentMonthStr) {
                    localStorage.setItem('thaana_lastMonthlyReset', currentMonthStr);
                    this.state.kids.forEach(k => k.monthlyPoints = 0);
                }

                // 4. Season Tracking (90 Days)
                let seasonEndStr = localStorage.getItem('thaana_seasonEnd') || '';
                let seasonStartStr = localStorage.getItem('thaana_seasonStart') || '';
                let seasonIndex = parseInt(localStorage.getItem('thaana_seasonIndex') || '1');
                
                if (!seasonEndStr || !seasonStartStr) {
                    const start = new Date();
                    const end = new Date();
                    end.setDate(start.getDate() + 90);
                    seasonStartStr = start.toDateString();
                    seasonEndStr = end.toDateString();
                    localStorage.setItem('thaana_seasonStart', seasonStartStr);
                    localStorage.setItem('thaana_seasonEnd', seasonEndStr);
                    localStorage.setItem('thaana_seasonIndex', seasonIndex);
                    localStorage.setItem('thaana_seasonName', `Season ${seasonIndex}`);
                }

                const seasonEndDate = new Date(seasonEndStr);
                const timeDiff = seasonEndDate.getTime() - now.getTime();
                let daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));

                // If Season ended
                if (daysLeft <= 0) {
                    seasonIndex++;
                    const start = new Date();
                    const end = new Date();
                    end.setDate(start.getDate() + 90);
                    seasonStartStr = start.toDateString();
                    seasonEndStr = end.toDateString();
                    localStorage.setItem('thaana_seasonStart', seasonStartStr);
                    localStorage.setItem('thaana_seasonEnd', seasonEndStr);
                    localStorage.setItem('thaana_seasonIndex', seasonIndex);
                    localStorage.setItem('thaana_seasonName', `Season ${seasonIndex}`);
                    this.state.kids.forEach(k => k.seasonPoints = 0);
                    daysLeft = 90;
                    setTimeout(() => {
                        this.mascotSay(`🌟 Welcome to Season ${seasonIndex}! A new 90-day learning adventure begins today! 🚀`, 8000);
                    }, 4000);
                }

                this.state.seasonName = `Season ${seasonIndex}`;
                this.state.seasonEnd = seasonEndStr;
                this.state.seasonDaysLeft = daysLeft;
            }

            checkMascotVisibility() {
                return false;
            }

            async initSupabase() {
                if (!this.supabase) return;

                // 0. Check Auth Session
                const { data: { session } } = await this.supabase.auth.getSession();
                this.handleSessionUpdate(session);

                this.supabase.auth.onAuthStateChange((event, newSession) => {
                    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                        this.handleSessionUpdate(newSession);
                    } else if (event === 'SIGNED_OUT') {
                        this.state.isLoggedIn = false;
                        this.switchView('landing');
                    }
                });

                // 1. Fetch Global Settings
                const { data: settings } = await this.supabase.from('settings').select('*').eq('id', 'global').single();
                if (settings) {
                    this.state.globalSettings = {
                        siteName: settings.site_name,
                        premiumPrice: settings.premium_price,
                        bankAccount: settings.bank_account,
                        bankName: settings.bank_name,
                        heroTitle: settings.hero_title,
                        heroSubtitle: settings.hero_subtitle,
                        heroBtnText: settings.hero_btn_text,
                        heroEmoji: settings.hero_emoji,
                        footerText: settings.footer_text
                    };
                    // Load mascot tips if stored
                    if (settings.mascot_tips) {
                        try { this.state.mascotTips = JSON.parse(settings.mascot_tips); } catch(e) {}
                    }
                }

                // 2. Fetch Curriculum & Nav
                const { data: nData } = await this.supabase.from('app_nav').select('*').order('order_index');
                if (nData && nData.length > 0) this.state.customNav = nData;

                const { data: fData } = await this.supabase.from('app_fili').select('*').order('order_index');
                if (fData && fData.length > 0) this.state.customFili = fData;

                const { data: eData } = await this.supabase.from('app_extras').select('*').order('order_index');
                if (eData) this.state.customExtras = eData;

                const { data: vData } = await this.supabase.from('app_videos').select('*').order('order_index');
                if (vData) this.state.customVideos = vData;

                const { data: cData } = await this.supabase.from('app_content').select('*').order('order_index');
                if (cData && cData.length > 0) {
                    const dbContent = { dhivehi: [], english: [], arabic: [], engdhi: [], numbers: [] };
                    cData.forEach(c => {
                        if (dbContent[c.category]) dbContent[c.category].push(c);
                    });
                    // Merge DB content with local fallbacks for empty categories
                    Object.keys(dbContent).forEach(cat => {
                        this.state.customContent[cat] = dbContent[cat].length > 0 ? dbContent[cat] : content[cat];
                    });
                }

                this.updateUIStrings();
                this.render();

                // 2. Realtime Listener for Settings
                this.supabase.channel('settings-db-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, payload => {
                        const s = payload.new;
                        this.state.globalSettings = {
                            siteName: s.site_name, premiumPrice: s.premium_price, bankAccount: s.bank_account,
                            bankName: s.bank_name, heroTitle: s.hero_title, heroSubtitle: s.hero_subtitle,
                            heroBtnText: s.hero_btn_text, heroEmoji: s.hero_emoji, footerText: s.footer_text
                        };
                        this.updateUIStrings();
                        this.render();
                    }).subscribe();

                // 3. Realtime Listener for Content (Quiz/Letters)
                this.supabase.channel('content-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_content' }, async () => {
                        const { data: cData } = await this.supabase.from('app_content').select('*').order('order_index');
                        if (cData) {
                            const dbContent = { dhivehi: [], english: [], arabic: [], engdhi: [], numbers: [] };
                            cData.forEach(c => {
                                if (dbContent[c.category]) dbContent[c.category].push(c);
                            });
                            // Merge with fallbacks
                            Object.keys(dbContent).forEach(cat => {
                                this.state.customContent[cat] = dbContent[cat].length > 0 ? dbContent[cat] : content[cat];
                            });
                            this.render();
                        }
                    }).subscribe();
            }

            async handleSessionUpdate(session) {
                if (session) {
                    this.state.isLoggedIn = true;
                    this.state.parentEmail = session.user.email;

                    // Fetch kids profiles
                    const { data: kidsData } = await this.supabase.from('kids').select('*').eq('user_id', session.user.id);
                    if (kidsData && kidsData.length > 0) {
                        const todayStr = new Date().toDateString();
                        const fridayStr = localStorage.getItem('thaana_lastWeeklyReset') || '';
                        const currentMonthStr = localStorage.getItem('thaana_lastMonthlyReset') || '';
                        this.state.kids = kidsData.map(k => {
                            const stats = k.stats || {};
                            const isToday = stats.lastActiveDate === todayStr;
                            const isThisWeek = stats.lastWeeklyDate === fridayStr;
                            const isThisMonth = stats.lastMonthlyDate === currentMonthStr;
                            return {
                                dbId: k.id,
                                name: k.name,
                                ageGroup: k.age_group,
                                avatar: k.avatar,
                                points: k.points,
                                seasonPoints: (stats.seasonPoints !== undefined) ? stats.seasonPoints : k.points,
                                monthlyPoints: (isThisMonth && stats.monthlyPoints !== undefined) ? stats.monthlyPoints : k.points,
                                weeklyPoints: (isThisWeek && stats.weeklyPoints !== undefined) ? stats.weeklyPoints : k.points,
                                dailyPoints: (isToday && stats.dailyPoints !== undefined) ? stats.dailyPoints : 0,
                                badges: k.badges || [],
                                stats: stats,
                                unlockedAvatars: k.unlocked_avatars || ['👶', '👧', '👦'],
                                pin: k.pin || '1234'
                            };
                        });
                    } else {
                        // Create default kid if none exists
                        const defaultKid = { user_id: session.user.id, name: 'ކުޑަކުއްޖާ', age_group: 'preschool', avatar: '👶', points: 0, pin: '1234' };
                        const { data: newKid } = await this.supabase.from('kids').insert(defaultKid).select().single();
                        if (newKid) {
                            this.state.kids = [{ dbId: newKid.id, name: newKid.name, ageGroup: newKid.age_group, avatar: newKid.avatar, points: newKid.points, seasonPoints: 0, monthlyPoints: 0, weeklyPoints: 0, dailyPoints: 0, badges: [], stats: {}, unlockedAvatars: ['👶', '👧', '👦'] }];
                        }
                    }
                    this.trackBadgeMetric('activeDay', new Date().toDateString());

                    // Check Premium Payment Status
                    const { data: paymentsData } = await this.supabase.from('payments').select('status').eq('user_id', session.user.id).eq('status', 'verified');
                    if (paymentsData && paymentsData.length > 0) {
                        this.state.isPremium = true;
                    }

                    if (this.state.view === 'landing' || this.state.view === 'login') {
                        this.switchView('soundboard');
                        // PIN Setup prompt for first timers
                        if (this.state.parentPin === '2345' || this.state.parentPin === '1234') {
                            setTimeout(() => {
                                this.mascotSay("Welcome! Please set a unique PIN in Settings to keep your account safe! 🔒", 6000);
                                this.handleParentAuth();
                            }, 3000);
                        }
                    } else {
                        this.render();
                    }
                }
            }

            async syncKidProgress(index) {
                if (!this.state.isLoggedIn || !this.supabase) return;
                const idx = index !== undefined ? index : this.state.activeKidIndex;
                const kid = this.state.kids[idx];
                if (kid && kid.dbId) {
                    if (!kid.stats) kid.stats = {};
                    kid.stats.seasonPoints = kid.seasonPoints;
                    kid.stats.monthlyPoints = kid.monthlyPoints;
                    kid.stats.weeklyPoints = kid.weeklyPoints;
                    kid.stats.dailyPoints = kid.dailyPoints;
                    kid.stats.lastActiveDate = new Date().toDateString();
                    kid.stats.lastWeeklyDate = localStorage.getItem('thaana_lastWeeklyReset') || '';
                    kid.stats.lastMonthlyDate = localStorage.getItem('thaana_lastMonthlyReset') || '';

                    await this.supabase.from('kids').update({
                        points: kid.points,
                        badges: kid.badges,
                        stats: kid.stats,
                        unlocked_avatars: kid.unlockedAvatars,
                        avatar: kid.avatar,
                        name: kid.name,
                        age_group: kid.ageGroup,
                        pin: kid.pin
                    }).eq('id', kid.dbId);
                }
            }

            initDecorations() {
                const bg = document.getElementById('bg-decoration');
                const letters = ['ހ', 'ށ', 'ނ', 'A', 'B', 'C', 'أ', 'ބ'];
                for (let i = 0; i < 15; i++) {
                    const el = document.createElement('div');
                    el.className = 'bg-letter';
                    el.innerText = letters[Math.floor(Math.random() * letters.length)];
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.top = Math.random() * 100 + 'vh';
                    el.style.transform = `rotate(${Math.random() * 360}deg)`;
                    bg.appendChild(el);
                }
            }

            handleParentAuth() {
                if (this.state.isLoggedIn) this.showPasscodeModal();
                else this.switchView('login');
            }

            showPasscodeModal() {
                const existing = document.getElementById('passcode-dropdown');
                if (existing) { existing.remove(); return; }

                const dropdown = document.createElement('div');
                dropdown.id = 'passcode-dropdown';
                dropdown.className = 'hub-dropdown-menu';
                dropdown.style.cssText = `position:fixed; top:80px; right:20px; width:340px; background:white; border:4px solid var(--border-dark); border-radius:30px; box-shadow:0 15px 45px rgba(0,0,0,0.2); z-index:9000; padding:30px; animation: slideDown 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); text-align:center`;

                dropdown.innerHTML = `
                    <h2 style="margin-bottom:20px; font-size:1.6rem; color:var(--primary)">${this.t('Parent Code')} 🔒</h2>
                    <div class="settings-group">
                        <input type="password" class="settings-input" id="parent-pin-input" placeholder="****" style="text-align:center; font-size:2.5rem; letter-spacing: 12px; margin-bottom:10px; width:100%">
                        <div class="forgot-link" onclick="app.forgotPin()" style="cursor:pointer; font-size:0.85rem; font-weight:800; color:#64748b; text-decoration:underline">${this.t('Forgot PIN?')}</div>
                    </div>
                    <button class="hub-action-btn" style="margin-top:20px; background:var(--primary); color:white; border-color:var(--primary-dark)" onclick="app.verifyPasscode()">${this.t('Unlock')} 🔓</button>
                `;
                document.body.appendChild(dropdown);
                document.getElementById('parent-pin-input').focus();

                setTimeout(() => {
                    const closer = (e) => {
                        if (!dropdown.contains(e.target) && !e.target.closest('.hub-action-btn')) {
                            dropdown.remove();
                            document.removeEventListener('click', closer);
                        }
                    };
                    document.addEventListener('click', closer);
                }, 100);
            }

            verifyPasscode() {
                if (document.getElementById('parent-pin-input').value === this.state.parentPin) {
                    const dropdown = document.getElementById('passcode-dropdown');
                    if (dropdown) dropdown.remove();
                    this.showSettings();
                } else {
                    this.mascotSay("Oops! Wrong PIN! 🧐");
                    document.getElementById('parent-pin-input').value = '';
                }
            }

            forgotPin() {

            triggerBubbleTransition(callback) {
                const overlay = document.getElementById('transition-overlay');
                overlay.innerHTML = '';
                const fragment = document.createDocumentFragment();
                const colors = ['#FFD93D', '#FF6B6B', '#4D96FF', '#6BCB77', '#FF8400', '#9b59b6', '#1abc9c'];
                for (let i = 0; i < 25; i++) {
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble-particle';
                    const size = 80 + Math.random() * 120;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    bubble.style.cssText = `width:${size}px; height:${size}px; left:${Math.random() * 100}vw; top:${Math.random() * 100}vh; background:${color}; border-color:white; opacity:0.8;`;
                    fragment.appendChild(bubble);
                }
                overlay.appendChild(fragment);
                setTimeout(() => { callback(); setTimeout(() => overlay.innerHTML = '', 1200); }, 600);
            }

            async submitPayment() {
                const fileInput = document.getElementById('slip-upload');
                const file = fileInput.files[0];
                if (!file) { alert("Please upload a slip!"); return; }
                if (!this.supabase) return alert("System offline. Try again later.");

                const btn = event.target;
                btn.innerText = "UPLOADING...";

                try {
                    // Upload slip to Supabase Storage
                    const ext = file.name.split('.').pop();
                    const filename = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
                    const { data: uploadData, error: uploadError } = await this.supabase.storage.from('slips').upload(filename, file);
                    if (uploadError) throw uploadError;

                    // Insert into Payments table
                    const { data: { session } } = await this.supabase.auth.getSession();
                    const { error: dbError } = await this.supabase.from('payments').insert({
                        user_id: session.user.id,
                        user_email: session.user.email,
                        amount: this.state.globalSettings.premiumPrice,
                        slip_url: filename,
                        status: 'pending'
                    });
                    if (dbError) throw dbError;

                    alert("Slip uploaded! Our team will verify and unlock your premium features shortly. ✨");
                    document.getElementById('payment-modal').remove();
                } catch (e) {
                    console.error(e);
                    alert("Upload failed. Please try again. " + e.message);
                    btn.innerText = "Verify Payment";
                }
            }

                        <div class="settings-group"><label class="settings-label">${this.t('Security (Parent PIN)')}</label><div style="display:flex; gap:10px"><input type="password" class="settings-input" id="new-pin" placeholder="New 4-digit PIN" style="margin-bottom:0"><button class="start-btn" style="padding:10px 20px; font-size:1rem; background:var(--teal)" onclick="app.updatePin()">${this.t('Save')}</button></div></div>
                        <div class="settings-group"><label class="settings-label">App Language</label>
                            <div class="lang-select-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                                <button class="lang-opt ${this.state.language === 'dhivehi' ? 'active' : ''}" onclick="app.updateLanguage('dhivehi')">ދިވެހި</button>
                                <button class="lang-opt ${this.state.language === 'english' ? 'active' : ''}" onclick="app.updateLanguage('english')">English ${!this.state.isPremium ? '🔒' : ''}</button>
                                <button class="lang-opt ${this.state.language === 'arabic' ? 'active' : ''}" onclick="app.updateLanguage('arabic')">العربية ${!this.state.isPremium ? '🔒' : ''}</button>
                                <button class="lang-opt ${this.state.language === 'numbers' ? 'active' : ''}" onclick="app.updateLanguage('numbers')" style="grid-column: span 2">Numbers ${!this.state.isPremium ? '🔒' : ''}</button>

                        </div>
                        <div class="settings-group"><label class="settings-label">Profiles</label><div id="profile-edit-list"></div><button class="nav-btn" style="width:100%; justify-content:center; margin-top:10px" onclick="app.addNewKid()">➕ Add Kid</button></div>
                `;
                document.body.appendChild(dropdown);
                this.renderProfileEdits();

                setTimeout(() => {
                    const closer = (e) => {
                        if (!dropdown.contains(e.target) && !e.target.closest('#profile-hub-container')) {
                            dropdown.remove();
                            document.removeEventListener('click', closer);
                        }
                    };
                    document.addEventListener('click', closer);

            updatePin() {
                const pin = document.getElementById('new-pin').value;
                if (pin.length === 4 && !isNaN(pin)) {
                    this.state.parentPin = pin;
                    localStorage.setItem('thaana_parentPin', pin);
                    alert("PIN updated successfully!");
                } else alert("Please enter a valid 4-digit PIN!");
            }

            renderProfileEdits() {
                const list = document.getElementById('profile-edit-list');
                list.innerHTML = this.state.kids.map((k, i) => `
                    <div class="profile-item" style="padding:25px; border-radius:25px; border:4px solid var(--border-dark); background:white; margin-bottom:20px">
                        <div style="display:flex; gap:15px; margin-bottom:15px">
                            <input type="text" class="settings-input" value="${k.name}" placeholder="Name" onchange="app.updateKidProp(${i}, 'name', this.value)" style="flex:1; margin-bottom:0">
                            <select class="settings-select" onchange="app.updateKidProp(${i}, 'ageGroup', this.value)" style="width:120px; margin-bottom:0">
                                <option value="toddler" ${k.ageGroup === 'toddler' ? 'selected' : ''}>2-3</option>
                                <option value="preschool" ${k.ageGroup === 'preschool' ? 'selected' : ''}>4-5</option>
                                <option value="junior" ${k.ageGroup === 'junior' ? 'selected' : ''}>6+</option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap">
                            ${k.unlockedAvatars.map(a => `<div onclick="app.updateKidProp(${i}, 'avatar', '${a}')" style="font-size:1.8rem; cursor:pointer; width:50px; height:50px; display:flex; align-items:center; justify-content:center; border-radius:15px; border:3px solid var(--border-dark); background:${k.avatar === a ? 'var(--warning)' : '#f8f9fa'}">${a}</div>`).join('')}
                            <button onclick="app.removeKid(${i})" style="margin-right:auto; border:none; background:#fee2e2; width:50px; height:50px; border-radius:15px; cursor:pointer; font-size:1.5rem; border:3px solid #ef4444">🗑️</button>
                        </div>
                    </div>`).join('');
            }

            async addNewKid() { 
                const session = await this.supabase.auth.getSession();
                const userId = session.data.session ? session.data.session.user.id : null;
                const newKid = { 
                    user_id: userId, 
                    name: 'ކުއްޖާ', 
                    age_group: 'preschool', 
                    avatar: '👶', 
                    points: 0, 
                    badges: [], 
                    unlocked_avatars: ['👶', '👧', '👦', '🐶', '🐱', '🦁', '🐯', '🐼', '🐨', '🦖', '🦄', '🤖', '👾', '🚀', '⭐'] 
                };
                const { data } = await this.supabase.from('kids').insert(newKid).select().single();
                if (data) {
                    this.state.kids.push({ 
                        dbId: data.id, name: data.name, ageGroup: data.age_group, avatar: data.avatar, 
                        points: data.points, badges: [], 
                        unlockedAvatars: data.unlocked_avatars 
                    });
                    this.renderProfileEdits();
                }
            }
            removeKid(i) { if (this.state.kids.length > 1) { this.state.kids.splice(i, 1); if (this.state.activeKidIndex >= i) this.state.activeKidIndex = 0; this.renderProfileEdits(); } else alert("At least one profile needed!"); }
            updateKidProp(i, prop, val) {
                this.state.kids[i][prop] = val;
                this.renderProfileEdits();
                this.renderProfileHub();
                this.syncKidProgress(i);
            }

            updateLanguage(lang) {
                if (lang !== 'dhivehi' && !this.state.isPremium) { this.showUpgradePopup(); this.render(); return; }
                this.state.language = lang;
                localStorage.setItem('thaana_language', lang);
                // Immediately switch to the relevant view for the new language
                if (lang === 'numbers') this.state.view = 'soundboard';
                
                // Collapse settings after change
                const existing = document.getElementById('settings-dropdown');
                if (existing) existing.remove();
                
                this.render();
            }

            async logout() {
                if (this.supabase) await this.supabase.auth.signOut();
                this.state.isLoggedIn = false;
                const hub = document.getElementById('hub-dropdown');
                if (hub) hub.remove();
                this.switchView('landing');
            }

            renderSoundboard() {
                const container = document.createElement('div');
                container.style.position = 'relative';

                const grid = document.createElement('div'); grid.className = 'alphabet-grid';
                grid.style.position = 'relative';
                grid.style.zIndex = '1';

                const isNumbers = this.state.language === 'numbers';
                const items = this.state.customContent[this.state.language] || [];
                items.forEach(item => {
                    const isEnglish = this.state.language === 'english';
                    const displayLetter = (isEnglish && item.letter.length === 1) ? item.letter.toUpperCase() + item.letter.toLowerCase() : item.letter;
                    const isDual = displayLetter.length > 1;
                    const card = document.createElement('div'); card.className = 'letter-card'; 
                    
                    if (isNumbers) {
                        card.innerHTML = `
                            <div style="font-size:4rem; font-weight:900; color:var(--primary); line-height:1">${item.letter}</div>
                            <div style="font-size:1.4rem; font-weight:800; color:var(--secondary); margin-top:8px">${item.dhivehi || item.name || ''}</div>
                            <div style="font-size:1.1rem; font-weight:700; color:#475569">${item.english || ''}</div>
                        `;
                        card.onclick = (e) => { 
                            this.playSound('click'); 
                            this.playAudio(item.audio_dhivehi || item.audio); 
                            if (item.audio_english) setTimeout(() => this.playAudio(item.audio_english), 1000);
                            this.createPop(e.pageX, e.pageY); 
                            this.addTaskProgress(); 
                        };
                    } else {
                        card.innerHTML = `<div style="font-size:${isDual ? '2.8rem' : '4rem'}; font-weight:900; letter-spacing:${isDual ? '2px' : 'normal'}">${displayLetter}</div><div style="font-size:1.2rem; font-weight:800">${item.name || item.dhivehi || ''}</div>`;
                        card.onclick = (e) => { this.playSound('click'); this.playAudio(item.audio); this.createPop(e.pageX, e.pageY); this.addTaskProgress(); this.trackBadgeMetric('letterClicks', item.letter); };
                    }
                    grid.appendChild(card);
                });
                container.appendChild(grid);
                this.viewContainer.appendChild(container);
            }


            renderVocabulary() {
                const isNumbers = this.state.language === 'numbers';
                const items = this.state.customContent[isNumbers ? 'numbers' : this.state.language] || [];
                if (!items.length) {
                    this.viewContainer.innerHTML = '<div style="padding:40px; text-align:center; font-weight:900; color:#94a3b8">No content found for this category yet!</div>';
                    return;
                }
                const grid = document.createElement('div'); grid.className = 'alphabet-grid';
                items.forEach(item => {
                    const card = document.createElement('div'); card.className = 'letter-card';
                    if (isNumbers) {
                        card.innerHTML = `
                            <div style="font-size:4rem; font-weight:900; color:var(--primary); line-height:1">${item.letter}</div>
                            <div style="font-size:1.4rem; font-weight:800; color:var(--secondary); margin-top:8px">${item.count_word_dhivehi || item.dhivehi || item.name || 'Count'}</div>
                            <div style="font-size:1.1rem; font-weight:700; color:#475569">${item.count_word_english || item.english || ''}</div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div style="width:100%; aspect-ratio:1; background:#f1f5f9; border-radius:20px; display:flex; align-items:center; justify-content:center; margin-bottom:15px; overflow:hidden">
                                ${item.image ? `<img src="${window.supabaseClient ? window.supabaseClient.storage.from('slips').getPublicUrl(item.image).data.publicUrl : ''}" style="width:100%; height:100%; object-fit:cover">` : '<span style="font-size:3rem">🖼️</span>'}
                            </div>
                            <div style="font-size:1.6rem; font-weight:900; color:var(--secondary)">${item.dhivehi || item.word}</div>
                            <div style="font-size:1rem; color:#64748b; font-weight:700">${item.english}</div>
                        `;
                    }
                    card.onclick = (e) => { 
                        this.playSound('click'); 
                        this.playAudio(isNumbers ? (item.audio_dhivehi || item.audio) : (item.word_audio || item.audio)); 
                        if (isNumbers && item.audio_english) setTimeout(() => this.playAudio(item.audio_english), 1000);
                        this.createPop(e.pageX, e.pageY); 
                    };
                    grid.appendChild(card);
                });
                this.viewContainer.appendChild(grid);
            }

            renderExtra() {
                const lang = this.state.language;
                const items = (this.state.customExtras || []).filter(e => !e.category || e.category === 'all' || e.category === lang);

                const container = document.createElement('div');
                container.style.cssText = 'padding:2rem;';

                const heading = document.createElement('div');
                heading.style.cssText = 'text-align:center; margin-bottom:2rem;';
                heading.innerHTML = `<div style="font-size:2.5rem; font-weight:900; color:var(--border-dark)">📄 Extra Resources</div>
                    <div style="color:#64748b; font-weight:700; margin-top:8px">Worksheets & learning materials</div>`;
                container.appendChild(heading);

                if (!items.length) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'text-align:center; padding:60px 20px; color:#94a3b8; font-size:1.2rem; font-weight:800;';
                    empty.innerHTML = `<div style="font-size:4rem; margin-bottom:15px">📋</div>No extra content yet!<br><span style="font-size:0.9rem; font-weight:600">Check back soon for worksheets and activities.</span>`;
                    container.appendChild(empty);
                    this.viewContainer.appendChild(container);
                    return;
                }

                const grid = document.createElement('div');
                grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:25px;';

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.style.cssText = 'background:white; border:4px solid var(--border-dark); border-radius:25px; box-shadow:6px 6px 0 var(--border-dark); overflow:hidden; transition:transform 0.2s, box-shadow 0.2s; cursor:pointer;';

                    const isImg = item.file_url && /\.(png|jpg|jpeg|gif|webp)/i.test(item.file_url);
                    const isPdf = item.file_url && /\.pdf/i.test(item.file_url);
                    const fileUrl = item.file_url && this.supabase
                        ? this.supabase.storage.from('extras').getPublicUrl(item.file_url).data.publicUrl
                        : (item.file_url || '');

                    let thumbHtml = '';
                    if (item.thumbnail_url && this.supabase) {
                        const thumbSrc = this.supabase.storage.from('extras').getPublicUrl(item.thumbnail_url).data.publicUrl;
                        thumbHtml = `<img src="${thumbSrc}" style="width:100%; height:180px; object-fit:cover; display:block;">`;
                    } else if (isImg) {
                        thumbHtml = `<img src="${fileUrl}" style="width:100%; height:180px; object-fit:cover; display:block;">`;
                    } else {
                        thumbHtml = `<div style="height:140px; background:linear-gradient(135deg,#eff6ff,#dbeafe); display:flex; align-items:center; justify-content:center; font-size:4rem;">${isPdf ? '📄' : '📁'}</div>`;
                    }

                    const filename = item.file_url ? item.file_url.split('/').pop() : 'download';
                    card.innerHTML = `
                        ${thumbHtml}
                        <div style="padding:20px;">
                            <div style="font-size:1.2rem; font-weight:900; color:var(--border-dark); margin-bottom:6px">${item.title || 'Worksheet'}</div>
                            ${item.description ? `<div style="font-size:0.9rem; color:#64748b; font-weight:600; margin-bottom:14px; line-height:1.4">${item.description}</div>` : ''}
                            ${fileUrl ? `<button onclick="app.downloadExtra('${fileUrl}','${filename}')" style="display:inline-block; padding:10px 22px; background:var(--primary); color:white; border-radius:15px; font-weight:900; font-size:0.95rem; border:3px solid var(--border-dark); box-shadow:3px 3px 0 var(--border-dark); cursor:pointer; transition:all 0.2s;">
                                ${isPdf ? '📥 Download PDF' : '📥 Download'}
                            </button>` : ''}
                        </div>`;

                    card.addEventListener('mouseenter', () => { card.style.transform = 'translateY(-4px)'; card.style.boxShadow = '8px 10px 0 var(--border-dark)'; });
                    card.addEventListener('mouseleave', () => { card.style.transform = ''; card.style.boxShadow = '6px 6px 0 var(--border-dark)'; });

                    grid.appendChild(card);
                });

                container.appendChild(grid);
                this.viewContainer.appendChild(container);
            }

                if (!this.state.videoFilterCat) this.state.videoFilterCat = 'all';

                // First filter by app language if applicable, then by active sub-filter tab
                let baseVideos = (this.state.customVideos || []).filter(v => !v.category || v.category === 'all' || v.category === lang);
                let videos = baseVideos;
                if (this.state.videoFilterCat !== 'all') {
                    videos = baseVideos.filter(v => v.category === this.state.videoFilterCat);
                }

                container.style.cssText = 'padding:2rem; max-width:1200px; margin:0 auto;';

                    { id: 'english', label: '<img src="https://flagcdn.com/w40/gb.png" style="width:24px; height:auto; display:inline-block; vertical-align:middle; margin-right:6px; border-radius:3px" alt="GB"> English' },
                    { id: 'arabic', label: '<img src="https://flagcdn.com/w40/sa.png" style="width:24px; height:auto; display:inline-block; vertical-align:middle; margin-right:6px; border-radius:3px" alt="SA"> Arabic' },

                    btn.innerHTML = cat.label;
                    btn.onclick = () => {
                        this.playSound('click');
                        this.state.videoFilterCat = cat.id;
                        this.render();
                    };
                    filterBar.appendChild(btn);
                });
                container.appendChild(filterBar);

                    const empty = document.createElement('div');
                    empty.style.cssText = 'text-align:center; padding:80px 20px; background:white; border:4px solid var(--border-dark); border-radius:35px; box-shadow:8px 8px 0 var(--border-dark); color:#94a3b8; font-size:1.3rem; font-weight:800; margin-top:2rem;';
                    empty.innerHTML = `<div style="font-size:5rem; margin-bottom:20px">📭</div>No videos available yet!<br><span style="font-size:1rem; font-weight:600; color:#64748b;">Check back soon or add videos via the Admin Panel.</span>`;
                    container.appendChild(empty);
                    this.viewContainer.appendChild(container);

                                sandbox="allow-scripts allow-same-origin allow-presentation"
                                title="${activeVid.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>

                                <div id="yt-play-pause-indicator" style="background:rgba(0,0,0,0.7); color:white; width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:3rem; opacity:0; transition:opacity 0.3s; pointer-events:none; border:3px solid white; box-shadow:0 10px 25px rgba(0,0,0,0.5);">⏸</div>
                            </div>
                        </div>
                        <div style="padding:24px 30px; background:white; display:flex; justify-content:space-between; align-items:center; border-top:4px solid var(--border-dark); flex-wrap:wrap; gap:15px;">
                            <div style="display:flex; align-items:center; gap:20px;">
                                <div style="width:50px; height:50px; border-radius:18px; background:var(--orange); display:flex; align-items:center; justify-content:center; font-size:1.8rem; box-shadow:3px 3px 0 var(--border-dark); border:2px solid var(--border-dark);">🎬</div>

                                    ✖ Close
                                </button>
                            </div>
                        </div>

                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*');

                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');

            buildReferenceCanvas(letter) {
                const ref = document.createElement('canvas');
                ref.width = 400; ref.height = 400;
                const rCtx = ref.getContext('2d');

                const draw = () => {
                    const ghostEl = document.querySelector('#canvas-area [style*="opacity:0.13"]');
                    const wrapperEl = document.querySelector('#canvas-area .canvas-wrapper');

                    let fontSize = 230; 
                    if (ghostEl && wrapperEl) {
                        const wrapperRect = wrapperEl.getBoundingClientRect();
                        const scale = 400 / wrapperRect.width; 
                        const cssFont = parseFloat(getComputedStyle(ghostEl).fontSize);
                        fontSize = cssFont * scale;
                    }

                    rCtx.clearRect(0, 0, 400, 400);
                    rCtx.fillStyle = '#000';
                    const isEnglish = this.state.language === 'english';
                    const displayLetterForCanvas = (isEnglish && letter.length === 1) ? letter.toUpperCase() + letter.toLowerCase() : letter;
                    const isDual = displayLetterForCanvas.length > 1;
                    const isWide = isEnglish && (letter.toUpperCase() === 'M' || letter.toUpperCase() === 'W');
                    
                    let displaySize = isDual ? Math.round(fontSize * 0.85) : Math.round(fontSize * 1.15); 
                    if (isWide) displaySize = Math.round(fontSize * 0.65);
                    
                    const spacingVal = isDual ? (displaySize * 0.22) : 0;
                    
                    const items = this.state.customContent[this.state.language] || [];
                    const item = items.find(i => i.letter === letter);
                    
                    if (item && item.ghost_path) {
                        // Use Vector Path
                        rCtx.strokeStyle = '#000';
                        rCtx.lineWidth = 40; 
                        rCtx.lineCap = 'round';
                        rCtx.lineJoin = 'round';
                        const p = new Path2D(item.ghost_path);
                        rCtx.stroke(p);
                        
                        const ghostEl = document.getElementById('ghost-letter');
                        if (ghostEl) ghostEl.innerHTML = `<svg viewBox="0 0 400 400" style="width:100%; height:100%; fill:none; stroke:#000; stroke-width:40; stroke-linecap:round; opacity:0.13"><path d="${item.ghost_path}" /></svg>`;
                        process();
                    } else if (item && item.ghost_image) {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.src = window.supabaseClient ? window.supabaseClient.storage.from('images').getPublicUrl(item.ghost_image).data.publicUrl : item.ghost_image;
                        img.onload = () => {
                            rCtx.drawImage(img, 50, 50, 300, 300);
                            process();
                            const ghostEl = document.getElementById('ghost-letter');
                            if (ghostEl) ghostEl.innerHTML = `<img src="${img.src}" style="width:70%; height:70%; object-fit:contain; opacity:0.3">`;
                        };
                    } else {
                        let fontFamily = "'Fredoka', Arial, sans-serif";
                        if (this.state.language === 'dhivehi') {
                            fontFamily = "'Faruma', 'MV Boli', sans-serif";
                        } else if (this.state.language === 'arabic') {
                            fontFamily = "Arial, sans-serif";
                        }
                        rCtx.font = `bold ${displaySize}px ${fontFamily}`;
                        rCtx.textAlign = 'center';
                        rCtx.textBaseline = 'middle';
                        if (rCtx.letterSpacing !== undefined) {
                            rCtx.letterSpacing = spacingVal + 'px';
                            rCtx.fillText(displayLetterForCanvas, 200, 200);
                        } else {
                            // Fallback for older browsers
                            rCtx.fillText(displayLetterForCanvas, 200, 200);
                        }
                        process();
                    }
                };

                const process = () => {

                    const imgData = rCtx.getImageData(0, 0, 400, 400).data;
                    const set = new Set();
                    let firstPx = -1;
                    for (let i = 0; i < imgData.length; i += 4) {
                        if (imgData[i + 3] > 40) {
                            set.add(i >> 2);
                            if (firstPx === -1) firstPx = i >> 2;
                        }
                    }
                    this.referencePixels = set;
                };

                const runAfterLayout = () => {
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(() => setTimeout(draw, 50));
                    } else {
                        setTimeout(draw, 600);
                    }
                };
                requestAnimationFrame(() => requestAnimationFrame(runAfterLayout));
            }


            setTracingColor(color) {
                this.tracingColor = color;
                const canvas = document.getElementById('tracing-canvas');
                if (canvas) canvas.getContext('2d').strokeStyle = color;
                document.querySelectorAll('#canvas-area [id^="col-"]').forEach(el => {
                    el.style.border = '3px solid transparent';
                });
                const targetId = 'col-' + color.slice(1);
                const sel = document.getElementById(targetId);
                if (sel) sel.style.border = '3px solid #000';

            setupTracingCanvas() {
                const canvas = document.getElementById('tracing-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                this.tracingColor = this.tracingColor || '#4D96FF';
                this.tracingBrushSize = 32;
                ctx.lineWidth = this.tracingBrushSize;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = this.tracingColor;
                let drawing = false, lx = 0, ly = 0;
                let lastUpdate = 0;
                let rect = canvas.getBoundingClientRect(); 
                let scaleX = 400 / rect.width, scaleY = 400 / rect.height;

                const pos = (e) => {
                    const src = e.touches ? e.touches[0] : e;
                    return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
                };

                const isCursorInsideLetter = (cx, cy, tolerance = 14) => {
                    if (!this.referencePixels) return true; // fallback if reference pixels not loaded yet
                    const cxRound = Math.round(cx);
                    const cyRound = Math.round(cy);
                    
                    // Direct hit
                    if (this.referencePixels.has(cyRound * 400 + cxRound)) return true;
                    
                    // Neighborhood check
                    const tolSq = tolerance * tolerance;
                    for (let dx = -tolerance; dx <= tolerance; dx += 2) {
                        for (let dy = -tolerance; dy <= tolerance; dy += 2) {
                            if (dx * dx + dy * dy <= tolSq) {
                                const px = cxRound + dx;
                                const py = cyRound + dy;
                                if (px >= 0 && px < 400 && py >= 0 && py < 400) {
                                    if (this.referencePixels.has(py * 400 + px)) {
                                        return true; // Found a letter pixel nearby
                                    }
                                }
                            }
                        }
                    }
                    return false; // No letter pixels nearby, definitely outside
                };

                const triggerOutsideWarning = (msgType) => {
                    this.playSound('wrong');
                    
                    // Flash the tracing box border/shadow red
                    const box = document.getElementById('tracing-box');
                    if (box) {
                        box.style.borderColor = '#ef4444';
                        box.style.boxShadow = '15px 15px 0 #ef4444';
                        setTimeout(() => {
                            box.style.borderColor = 'var(--border-dark)';
                            box.style.boxShadow = '15px 15px 0 var(--border-dark)';
                        }, 500);
                    }
                    
                    // Set feedback message
                    const fb = document.getElementById('tracing-feedback');
                    let msg = "";
                    if (msgType === 'start') {
                        msg = "Start inside the letter! ✏️";
                        if (this.state.language === 'dhivehi') msg = "އަކުރުގެ އެތެރެއިން ފަށާ! ✏️";
                        else if (this.state.language === 'arabic') msg = "ابدأ من داخل الحرف! ✏️";
                    } else {
                        msg = "Oops! Stay inside the lines! ✏️";
                        if (this.state.language === 'dhivehi') msg = "އައުޗް! ރޮނގުން ބޭރަށް ނުދޭ! ✏️";
                        else if (this.state.language === 'arabic') msg = "عذراً! ابقَ داخل الخطوط! ✏️";
                    }
                    if (fb) fb.innerHTML = `<span style="color:#ef4444">${msg}</span>`;
                };

                const start = (e) => {
                    e.preventDefault(); 
                    rect = canvas.getBoundingClientRect(); 
                    scaleX = 400 / rect.width; scaleY = 400 / rect.height;
                    const p = pos(e);
                    
                    if (!isCursorInsideLetter(p.x, p.y)) {
                        triggerOutsideWarning('start');
                        return;
                    }
                    
                    drawing = true;
                    lx = p.x; ly = p.y;
                    ctx.beginPath(); ctx.moveTo(lx, ly);
                    this.trackBadgeMetric('colorsUsed', this.tracingColor);
                    
                    // Clear any previous error message on successful start
                    const fb = document.getElementById('tracing-feedback');
                    if (fb) fb.innerHTML = '';
                };

                const move = (e) => {
                    if (!drawing) return; e.preventDefault();
                    const p = pos(e);
                    
                    const steps = Math.max(1, Math.ceil(Math.hypot(p.x - lx, p.y - ly) / 8)); 
                    const br = Math.ceil(this.tracingBrushSize / 2);
                    const brSq = br * br;
                    
                    let wentOutside = false;
                    let lastBx = lx;
                    let lastBy = ly;
                    
                    for (let s = 0; s <= steps; s++) {
                        const bx = Math.round(lx + (p.x - lx) * s / steps);
                        const by = Math.round(ly + (p.y - ly) * s / steps);
                        
                        if (!isCursorInsideLetter(bx, by)) {
                            wentOutside = true;
                            break;
                        }
                        
                        lastBx = bx;
                        lastBy = by;
                        
                        for (let dx = -br; dx <= br; dx += 2) { 
                            for (let dy = -br; dy <= br; dy += 2) {
                                if (dx*dx + dy*dy <= brSq) {
                                    const px = bx + dx, py = by + dy;
                                    if (px >= 0 && px < 400 && py >= 0 && py < 400) {
                                        const idx = py * 400 + px;
                                        if (!this.drawnPixels.has(idx)) {
                                            if (this.referencePixels && this.referencePixels.has(idx)) {
                                                this.coveredCount++;
                                            }
                                            this.drawnPixels.add(idx);
                                        }
                                    }
                                }
                            }
                        }
                    }
                    
                    if (wentOutside) {
                        ctx.lineTo(lastBx, lastBy);
                        ctx.stroke();
                        drawing = false;
                        triggerOutsideWarning('move');
                        return;
                    }
                    
                    ctx.lineTo(p.x, p.y); ctx.stroke();
                    lx = p.x; ly = p.y;
                    
                    const now = Date.now();
                    if (now - lastUpdate > 100) {
                        this.updateAccuracyBar();
                        lastUpdate = now;
                    }
                };

                const stop = () => { 
                    if (drawing) {
                        drawing = false; 
                        this.checkTracingAccuracy();
                    }
                };
                canvas.addEventListener('mousedown', start);
                canvas.addEventListener('mousemove', move);
                canvas.addEventListener('mouseup', stop);
                canvas.addEventListener('mouseleave', stop);
                canvas.addEventListener('touchstart', start, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                canvas.addEventListener('touchend', stop);
            }

            updateAccuracyBar() {
                if (!this.referencePixels || !this.referencePixels.size) return;
                const pct = Math.min(100, Math.round(this.coveredCount / this.referencePixels.size * 100));
                const fill = document.getElementById('accuracy-fill');
                const pctEl = document.getElementById('accuracy-pct');
                if (fill) fill.style.width = pct + '%';
                if (pctEl) pctEl.textContent = pct + '%';
            }

            clearTracingCanvas() {
                const canvas = document.getElementById('tracing-canvas');
                if (canvas) canvas.getContext('2d').clearRect(0, 0, 400, 400);
                this.drawnPixels = new Set();
                this.coveredCount = 0;
                const fill = document.getElementById('accuracy-fill');
                const pctEl = document.getElementById('accuracy-pct');
                if (fill) fill.style.width = '0%';
                if (pctEl) pctEl.textContent = '0%';
                const fb = document.getElementById('tracing-feedback');
                if (fb) fb.innerHTML = '';
            }

            checkTracingAccuracy() {
                if (!this.referencePixels || !this.referencePixels.size) {
                    this.triggerExplosion(); this.addTaskProgress(); return;
                }
                const pct = Math.min(100, Math.round(this.coveredCount / this.referencePixels.size * 100));
                const fb = document.getElementById('tracing-feedback');
                if (pct >= 50) {
                    if (fb) fb.innerHTML = `<span style="color:#22c55e">🌟 ވަރަށް ރަނގަޅު! ${pct}% traced correctly!</span>`;
                    this.triggerExplosion();
                    this.addTaskProgress();
                    const items = this.state.customContent[this.state.language === 'engdhi' ? 'english' : this.state.language] || [];
                    const next = items[items.findIndex(i => i.letter === this.currentTracingLetter) + 1] || items[0];
                    setTimeout(() => { if (this.state.view === 'tracing') this.initTracingCanvas(next.letter); }, 2000);
                } else if (pct >= 35) {
                    if (fb) fb.innerHTML = `<span style="color:var(--orange)">👍 Almost! ${pct}% — Try to cover more of the letter!</span>`;
                } else {
                    if (fb) fb.innerHTML = `<span style="color:#ef4444">✏️ Keep practicing! Only ${pct}% — Follow the ghost letter outline!</span>`;
                }
            }

            renderQuiz() {

            nextQuizQuestion() {
                const items = (this.state.customContent[this.state.language] || []).filter(i => i.image);
                if (!items.length) {
                    document.getElementById('quiz-options').innerHTML = `<p style="grid-column:1/-1; color:#94a3b8; font-size:1rem">Waiting for quiz content...</p>`;
                    return;
                }
                const target = items[Math.floor(Math.random() * items.length)];
                const pool = this.state.customContent[this.state.language] || [];
                
                let options = [];
                const correctAnswerStr = (target.quiz_answer || target.letter || '').trim();

                if (target.quiz_options) {
                    const customOpts = target.quiz_options.split(/[,،]+/).map(s => s.trim()).filter(s => s);
                    if (customOpts.length > 0) {
                        options = customOpts.map(opt => ({ label: opt, isCorrect: opt === correctAnswerStr }));
                    }
                }

                if (options.length === 0) {
                    options = [{ label: correctAnswerStr, isCorrect: true }];
                    while (options.length < 4 && options.length < pool.length) { 
                        const r = pool[Math.floor(Math.random() * pool.length)]; 
                        const rLabel = (r.letter || '').trim();
                        if (!options.find(o => o.label === rLabel)) {
                            options.push({ label: rLabel, isCorrect: false });
                        }
                    }
                }
                options.sort(() => Math.random() - 0.5);
                const imgUrl = target.image && window.supabaseClient
                    ? window.supabaseClient.storage.from('images').getPublicUrl(target.image).data.publicUrl
                    : `https://placehold.co/200?text=${encodeURIComponent(target.word || target.letter)}`;
                const quizImg = document.getElementById('quiz-img');
                quizImg.src = imgUrl;
                quizImg.onerror = () => quizImg.src = `https://placehold.co/200/e2e8f0/64748b?text=${encodeURIComponent(target.word || target.letter)}`;
                
                const titleEl = document.getElementById('quiz-title');
                if (titleEl) titleEl.textContent = target.quiz_question || this.t('What is this letter?');
                
                const grid = document.getElementById('quiz-options'); grid.innerHTML = '';
                options.forEach(opt => {
                    const btn = document.createElement('button'); btn.className = 'start-btn'; btn.innerText = opt.label; btn.style.background = 'var(--pink)';
                    btn.onclick = () => { 
                        this.playSound('click'); 
                        if (opt.isCorrect) { 
                            this.triggerExplosion(); 
                            this.addTaskProgress(); 
                            setTimeout(() => this.nextQuizQuestion(), 1500); 
                        } else btn.style.background = '#94a3b8'; 
                    };
                    grid.appendChild(btn);
                });
            }

            trackBadgeMetric(metric, value) {
                const kid = this.state.kids[this.state.activeKidIndex];
                if (!kid.stats) kid.stats = {};
                if (metric === 'wordCardsClicked') {
                    kid.stats.wordCardsClicked = (kid.stats.wordCardsClicked || 0) + 1;
                } else if (metric === 'numbersClicked') {
                    if (!kid.stats.numbersClicked) kid.stats.numbersClicked = {};
                    kid.stats.numbersClicked[value] = true;
                } else if (metric === 'wordSoundsListened') {
                    if (!kid.stats.wordSoundsListened) kid.stats.wordSoundsListened = {};
                    kid.stats.wordSoundsListened[value] = true;
                    kid.stats.totalAudioListened = (kid.stats.totalAudioListened || 0) + 1;
                } else if (metric === 'colorsUsed') {
                    if (!kid.stats.colorsUsed) kid.stats.colorsUsed = {};
                    kid.stats.colorsUsed[value] = true;
                } else if (metric === 'filiClicks') {
                    kid.stats.filiClicks = (kid.stats.filiClicks || 0) + 1;
                    kid.stats.totalAudioListened = (kid.stats.totalAudioListened || 0) + 1;
                } else if (metric === 'letterClicks') {
                    kid.stats.letterClicks = (kid.stats.letterClicks || 0) + 1;
                    kid.stats.totalAudioListened = (kid.stats.totalAudioListened || 0) + 1;
                } else if (metric === 'mysteryBoxesOpened') {
                    kid.stats.mysteryBoxesOpened = (kid.stats.mysteryBoxesOpened || 0) + 1;
                } else if (metric === 'dinoJumpsPlayed') {
                    kid.stats.dinoJumpsPlayed = (kid.stats.dinoJumpsPlayed || 0) + 1;
                } else if (metric === 'tabVisited') {
                    if (!kid.stats.tabsVisited) kid.stats.tabsVisited = {};
                    kid.stats.tabsVisited[value] = true;
                } else if (metric === 'activeDay') {
                    if (!kid.stats.activeDaysMap) kid.stats.activeDaysMap = {};
                    if (!kid.stats.activeDaysMap[value]) {
                        kid.stats.activeDaysMap[value] = true;
                        kid.stats.activeDaysCount = Object.keys(kid.stats.activeDaysMap).length;
                    }
                }
                this.checkBadges(kid);
                this.syncKidProgress();
            }

            renderBadges() {
                const activeKid = this.state.kids[this.state.activeKidIndex];
                const earned = activeKid.badges || [];
                const badges_data = badges; // Use global badges

                this.viewContainer.innerHTML = `
                    <div class="hall-container" style="max-width:1000px; margin:4rem auto; padding:40px; background:white; border-color:var(--primary)">
                        <h2 style="text-align:center; margin-bottom:10px; color:var(--primary)">🏅 ${this.t('Badges')}</h2>

                                        </div>
                                    ` : '<div style="font-size:0.6rem; color:#16a34a; font-weight:900; margin-top:5px">✓ EARNED</div>'}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;

            getBadgeProgress(id, kid) {
                const p = (cur, tar) => Math.min(100, Math.round(((cur || 0) / tar) * 100));
                const stats = kid.stats || {};
                
                switch(id) {
                    case 1: return kid.points > 0 ? 100 : 0;
                    case 2: return p(stats.totalTraces, 5);
                    case 3: return p(stats.totalQuizzes, 10);
                    case 4: return p(Object.keys(stats.wordSoundsListened || {}).length, 10);
                    case 5: return p(stats.dhivehiTasks, 20);
                    case 6: return p(stats.englishTasks, 10);
                    case 7: return p(stats.arabicTasks, 10);
                    case 12: return p(Object.keys(stats.colorsUsed || {}).length, 5);
                    case 14: return p(stats.wordCardsClicked, 15);
                    case 24: return p(this.state.dailyTasksCompleted, 5);
                    case 27: return p(kid.points, 1000);
                    case 28: return p(stats.totalTraces, 20);
                    case 34: return p(kid.points, 1500);
                    case 38: return p(kid.points, 2000);
                    case 44: return p(kid.points, 3000);
                    case 45: return p(this.state.kids.length, 2);
                    case 46: return p(kid.points, 4000);
                    case 48: return p(kid.points, 5000);
                    case 51: return p(Object.keys(stats.numbersClicked || {}).length, 10);
                    case 58: return p(stats.numPoints, 100);
                    case 62: return p(stats.numPoints, 100);
                    case 71: return p(Object.keys(stats.watchedVideos || {}).length, 1);
                    case 72: return p(Object.keys(stats.watchedVideos || {}).length, 5);
                    case 73: return p(Object.keys(stats.watchedVideos || {}).length, 10);
                    case 74: return p(stats.videoPointsEarned, 150);
                    case 75: return p(Object.keys(stats.videoCategoriesWatched || {}).length, 3);
                    case 76: return p(Object.keys(stats.watchedVideos || {}).length, 20);
                    default: return 0;
                }
            }
